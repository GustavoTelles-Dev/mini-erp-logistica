<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e1f" media="(prefers-color-scheme: dark)">
<title>Rota ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   ROTA ERP — front-end do Mini ERP de Logística (v3)
   Layout: sidebar flutuante e colapsável (ref. 21st.dev) + área de
   trabalho em grade "bento" de cards arredondados (ref. Behance/Finnova).
   Destaque ousado em um só lugar: o painel escuro + card índigo de detalhe.
   Tipografia: Urbanist (spec do case Behance: 32 / 18 / 14 com 160%).

   v3 — componentes do 21st.dev portados para CSS/JS puro:
     • Glowing Effect (Aceternity): borda que acende seguindo o cursor
     • Border Beam (Magic UI): feixe de luz na fila quando há despacho pendente
     • Abas com indicador deslizante (padrão "animated tabs")
   Navegação por largura: sidebar inteira > 1100px, trilho de ícones
   entre 641 e 1100px, barra inferior de abas até 640px.
   ===================================================================== */
:root {
  /* superfícies e texto */
  --bg: #f3f4f9;
  --glow: rgba(91, 76, 240, .07);
  --surface: #ffffff;
  --surface-2: #f6f7fb;
  --surface-3: #eceef6;
  --fg: #161a33;
  --fg-2: #4a4f6e;
  --muted: #6f7493;
  --border: #e6e8f1;
  /* marca: índigo */
  --primary: #5b4cf0;
  --primary-strong: #4a3be0;
  --primary-soft: #eeebff;
  --on-primary: #ffffff;
  --shadow-primary: 0 8px 22px rgba(91, 76, 240, .30);
  /* painel escuro (master) e card de detalhe */
  --ink: #1a1c3a;
  --ink-2: #24274b;
  --ink-3: #2e3260;
  --ink-fg: #eceefb;
  --ink-muted: #a3a6cc;
  --detail-a: #4b3ce6;
  --detail-b: #7a6cff;
  /* status (spec Behance + índigo da marca) */
  --amber: #eca118; --amber-soft: #fff3d9; --amber-ink: #8a5a00;
  --indigo: #5b4cf0; --indigo-soft: #eeebff; --indigo-ink: #4433d6;
  --green: #1fb77a; --green-soft: #dff5eb; --green-ink: #0f7650;
  --danger: #f0475c; --danger-soft: #fde8eb; --danger-ink: #c32a40;
  /* avatares */
  --av0-bg: #eeebff; --av0-fg: #4433d6;
  --av1-bg: #fff3d4; --av1-fg: #8a5a00;
  --av2-bg: #e2f8e9; --av2-fg: #13793a;
  --av3-bg: #fde8eb; --av3-fg: #c32a40;
  --av4-bg: #e3f2fb; --av4-fg: #1a6a96;
  /* efeitos */
  --shadow-sm: 0 1px 2px rgba(22, 26, 51, .04), 0 6px 18px rgba(22, 26, 51, .04);
  --shadow-md: 0 14px 34px rgba(22, 26, 51, .10);
  --shadow-lg: 0 24px 60px rgba(22, 26, 51, .22);
  --spot: rgba(91, 76, 240, .10);
  --spot-ink: rgba(255, 255, 255, .07);
  /* borda do painel escuro: no tema escuro ela é o que separa o painel do fundo */
  --ink-border: transparent;
  /* Glowing Effect: cores do arco de luz (índigo -> violeta -> verde da marca) */
  --glow-a: #5b4cf0; --glow-b: #a78bfa; --glow-c: #1fb77a;
  /* Border Beam */
  --beam-a: #a99fff; --beam-b: #f6c24d;
  /* aba ativa (indicador deslizante) */
  --seg-on: #1a1c3a; --seg-on-fg: #eceefb;
  /* séries do gráfico de fluxo (verde mais escuro que --green para passar contraste no claro) */
  --ch-a: #5b4cf0; --ch-b: #17a06a;
  --scrim: rgba(16, 18, 40, .45);
  /* tipografia */
  --font: "Urbanist", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* raios por hierarquia: tela > card > peça interna > pílula */
  --r-xl: 26px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px; --pill: 999px;
  --side-w: 256px; --side-w-min: 80px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e1f; --glow: rgba(122, 108, 255, .13);
    --surface: #151833; --surface-2: #1b1f3d; --surface-3: #232748;
    --fg: #eceefb; --fg-2: #bdc0de; --muted: #8e92b8; --border: #272b4f;
    --primary: #7a6cff; --primary-strong: #8c80ff; --primary-soft: #26245a; --on-primary: #ffffff;
    --shadow-primary: 0 8px 22px rgba(122, 108, 255, .35);
    --ink: #12142e; --ink-2: #1c1f44; --ink-3: #262a58; --ink-fg: #eceefb; --ink-muted: #9a9dc6;
    --amber-soft: #3a2d0b; --amber-ink: #f6c24d;
    --indigo-soft: #26245a; --indigo-ink: #a99fff;
    --green: #2fcf8d; --green-soft: #0e2e22; --green-ink: #5fe0a8;
    --ink-border: #2a2e57; --glow-a: #8c80ff; --glow-b: #c4b5fd; --glow-c: #2fcf8d;
    --seg-on: #3a3e8c; --seg-on-fg: #ffffff;
    --ch-a: #7a6cff; --ch-b: #22ad75;
    --danger-soft: #3b1420; --danger-ink: #ff8798;
    --av0-bg: #26245a; --av0-fg: #b3aaff; --av1-bg: #3a2d0b; --av1-fg: #f6c24d;
    --av2-bg: #0f2f1c; --av2-fg: #5fe08b; --av3-bg: #3b1420; --av3-fg: #ff8798;
    --av4-bg: #0e2a3b; --av4-fg: #6cc4f0;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
    --shadow-md: 0 14px 34px rgba(0, 0, 0, .45);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, .6);
    --spot: rgba(122, 108, 255, .16); --spot-ink: rgba(255, 255, 255, .06);
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e1f; --glow: rgba(122, 108, 255, .13);
  --surface: #151833; --surface-2: #1b1f3d; --surface-3: #232748;
  --fg: #eceefb; --fg-2: #bdc0de; --muted: #8e92b8; --border: #272b4f;
  --primary: #7a6cff; --primary-strong: #8c80ff; --primary-soft: #26245a; --on-primary: #ffffff;
  --shadow-primary: 0 8px 22px rgba(122, 108, 255, .35);
  --ink: #12142e; --ink-2: #1c1f44; --ink-3: #262a58; --ink-fg: #eceefb; --ink-muted: #9a9dc6;
  --amber-soft: #3a2d0b; --amber-ink: #f6c24d;
  --indigo-soft: #26245a; --indigo-ink: #a99fff;
  --green: #2fcf8d; --green-soft: #0e2e22; --green-ink: #5fe0a8;
  --ink-border: #2a2e57; --glow-a: #8c80ff; --glow-b: #c4b5fd; --glow-c: #2fcf8d;
  --seg-on: #3a3e8c; --seg-on-fg: #ffffff;
  --ch-a: #7a6cff; --ch-b: #22ad75;
  --danger-soft: #3b1420; --danger-ink: #ff8798;
  --av0-bg: #26245a; --av0-fg: #b3aaff; --av1-bg: #3a2d0b; --av1-fg: #f6c24d;
  --av2-bg: #0f2f1c; --av2-fg: #5fe08b; --av3-bg: #3b1420; --av3-fg: #ff8798;
  --av4-bg: #0e2a3b; --av4-fg: #6cc4f0;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
  --shadow-md: 0 14px 34px rgba(0, 0, 0, .45);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, .6);
  --spot: rgba(122, 108, 255, .16); --spot-ink: rgba(255, 255, 255, .06);
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  font-family: var(--font); font-size: 14px; line-height: 1.6; color: var(--fg);
  background: radial-gradient(1100px 560px at -10% -15%, var(--glow), transparent 60%), var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
button, input, select { font: inherit; color: inherit; }
button, a, select { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
.skip {
  position: fixed; left: 16px; top: 12px; z-index: 100; padding: 10px 16px; border-radius: var(--pill);
  background: var(--primary); color: var(--on-primary); font-weight: 600; transform: translateY(-160%); transition: transform .2s;
}
.skip:focus { transform: none; }
#detail { scroll-margin-top: 16px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg { flex: none; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 16px; height: 16px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px;
  padding: 16px; padding-block: 16px; min-height: 100vh;
}

/* ---------- sidebar (colapsável, ref. 21st.dev) ---------- */
.sidebar {
  position: sticky; top: 16px; height: calc(100vh - 32px);
  width: var(--side-w); display: flex; flex-direction: column; gap: 6px;
  padding: 18px 12px 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-sm);
  transition: width .3s cubic-bezier(.2, .8, .2, 1);
  z-index: 40;
}
:is(.app.collapsed, .app.rail) .sidebar { width: var(--side-w-min); }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 18px; border-bottom: 1px solid var(--border); margin-bottom: 8px; min-width: 0; }
.brand-mark {
  width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid; place-items: center; color: #fff;
  background: linear-gradient(140deg, var(--detail-a), var(--detail-b)); box-shadow: var(--shadow-primary);
}
.brand-mark .ic { width: 22px; height: 22px; }
.brand-text { min-width: 0; overflow: hidden; white-space: nowrap; }
.brand-name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav-group { font-size: 12px; font-weight: 600; color: var(--muted); padding: 14px 14px 4px; white-space: nowrap; overflow: hidden; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px;
  border: 0; border-radius: var(--r-md); background: transparent; color: var(--fg-2);
  font-size: 14px; font-weight: 600; text-align: left; white-space: nowrap;
  transition: background .2s, color .2s;
}
.nav-item .ic { transition: transform .2s; }
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item:hover .ic { transform: translateX(2px); }
.nav-item.active { background: var(--primary-soft); color: var(--primary); }
.nav-item.active::before {
  content: ""; position: absolute; left: -12px; top: 12px; bottom: 12px; width: 4px;
  border-radius: 0 4px 4px 0; background: var(--primary);
}
.nav-label { overflow: hidden; }
.nav-badge {
  margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--pill);
  background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 700;
  display: inline-grid; place-items: center;
}
:is(.app.collapsed, .app.rail) .nav-label, :is(.app.collapsed, .app.rail) .brand-text, :is(.app.collapsed, .app.rail) .nav-group,
:is(.app.collapsed, .app.rail) .user-text, :is(.app.collapsed, .app.rail) .collapse-label { display: none; }
:is(.app.collapsed, .app.rail) .nav-item { justify-content: center; padding: 0; }
:is(.app.collapsed, .app.rail) .nav-badge { position: absolute; top: 6px; right: 8px; min-width: 18px; height: 18px; font-size: 11px; padding: 0 5px; }
:is(.app.collapsed, .app.rail) .brand { justify-content: center; padding-inline: 0; }
/* tooltip do item quando a sidebar está recolhida */
:is(.app.collapsed, .app.rail) .nav-item::after {
  content: attr(data-label); position: absolute; left: calc(100% + 14px); top: 50%;
  transform: translate(-4px, -50%); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--ink-fg); font-size: 12px; font-weight: 600;
  padding: 6px 10px; border-radius: var(--r-sm); white-space: nowrap; box-shadow: var(--shadow-md);
  transition: opacity .15s, transform .15s;
}
:is(.app.collapsed, .app.rail) .nav-item:hover::after, :is(.app.collapsed, .app.rail) .nav-item:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 10px; }
.user {
  display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r-md); min-width: 0;
}
:is(.app.collapsed, .app.rail) .user { justify-content: center; }
.user-text { min-width: 0; overflow: hidden; white-space: nowrap; }
.user-name { font-weight: 700; font-size: 14px; line-height: 1.3; }
.user-role { font-size: 12px; color: var(--muted); }
.collapse-btn { color: var(--muted); }
.collapse-btn .ic { transition: transform .3s; }
:is(.app.collapsed, .app.rail) .collapse-btn .ic { transform: rotate(180deg); }

/* ---------- main / topbar ---------- */
.main { min-width: 0; display: flex; flex-direction: column; gap: 22px; padding-block: 6px 24px; }
#content { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.icon-btn.menu-btn { display: none; }
.title-block { min-width: 0; margin-right: auto; }
.title-block h1 { font-size: 32px; font-weight: 600; letter-spacing: -.015em; }
.title-block p { color: var(--muted); font-size: 14px; margin-top: 4px; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.search {
  display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; width: 260px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--pill); color: var(--muted);
  transition: border-color .2s, box-shadow .2s;
}
.search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; height: 100%; color: var(--fg); font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.icon-btn {
  position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--border); color: var(--fg-2);
  transition: background .2s, color .2s, transform .2s, box-shadow .2s;
}
.icon-btn:hover { color: var(--primary); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.icon-btn .dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--surface); }
.side-btn {
  display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border: 0; border-radius: var(--r-md);
  background: transparent; font-weight: 600; font-size: 14px; white-space: nowrap; transition: background .2s, color .2s;
}
.side-btn:hover { background: var(--surface-2); color: var(--fg); }
:is(.app.collapsed, .app.rail) .side-btn { justify-content: center; padding: 0; }

/* ---------- avatar ---------- */
.av {
  width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; letter-spacing: .02em;
}
.av-sm { width: 30px; height: 30px; font-size: 12px; }
.av-lg { width: 56px; height: 56px; font-size: 18px; }
.av-0 { background: var(--av0-bg); color: var(--av0-fg); }
.av-1 { background: var(--av1-bg); color: var(--av1-fg); }
.av-2 { background: var(--av2-bg); color: var(--av2-fg); }
.av-3 { background: var(--av3-bg); color: var(--av3-fg); }
.av-4 { background: var(--av4-bg); color: var(--av4-fg); }
.av-me { background: linear-gradient(140deg, var(--detail-a), var(--detail-b)); color: #fff; }
.stack { display: flex; }
.stack .av { box-shadow: 0 0 0 2px var(--surface); }
.stack .av + .av { margin-left: -3px; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px;
  border-radius: var(--pill); border: 1px solid transparent; font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: background .2s, box-shadow .2s, transform .15s, color .2s, border-color .2s;
}
.btn:active { transform: translateY(1px) scale(.99); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-strong); box-shadow: var(--shadow-primary); }
.btn-soft { background: var(--surface); border-color: var(--border); color: var(--fg); }
.btn-soft:hover { border-color: var(--primary); color: var(--primary); }
.btn-ghost { background: transparent; color: var(--fg-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { box-shadow: 0 8px 20px rgba(240, 71, 92, .3); }
.btn-white { background: #fff; color: #1a1c3a; }
.btn-white:hover { box-shadow: 0 8px 22px rgba(0, 0, 0, .25); }
.btn-sm { height: 34px; padding: 0 14px; font-size: 13px; }
.icon-act {
  width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; border: 0;
  background: transparent; color: var(--muted); transition: background .2s, color .2s;
}
.icon-act:hover { background: var(--surface-3); color: var(--fg); }
.icon-act.del:hover { background: var(--danger-soft); color: var(--danger-ink); }

/* ---------- segmented / pílulas (ref. Behance + Finnova) ---------- */
.seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--pill); flex-wrap: wrap; }
.seg button {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border: 0; border-radius: var(--pill);
  background: transparent; color: var(--fg-2); font-weight: 600; font-size: 13px; transition: background .2s, color .2s;
}
.seg button:hover { color: var(--fg); background: var(--surface-2); }
.seg button.on { background: var(--seg-on); color: var(--seg-on-fg); }
.seg .n { min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--pill); display: inline-grid; place-items: center; font-size: 12px; background: var(--surface-3); color: var(--fg-2); }
.seg button.on .n { background: var(--primary); color: #fff; }

/* ---------- chips de status ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: var(--pill);
  font-size: 12px; font-weight: 700; white-space: nowrap;
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.pend { background: var(--amber-soft); color: var(--amber-ink); }
.chip.pend::before { background: var(--amber); }
.chip.tran { background: var(--indigo-soft); color: var(--indigo-ink); }
.chip.tran::before { background: var(--indigo); }
.chip.entr { background: var(--green-soft); color: var(--green-ink); }
.chip.entr::before { background: var(--green); }
.chip.on { background: var(--green-soft); color: var(--green-ink); }
.chip.on::before { background: var(--green); }
.chip.off { background: var(--surface-3); color: var(--muted); }
.chip.off::before { background: var(--muted); }

/* ---------- cards / bento ---------- */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.c-3 { grid-column: span 3; } .c-4 { grid-column: span 4; } .c-5 { grid-column: span 5; }
.c-6 { grid-column: span 6; } .c-7 { grid-column: span 7; } .c-8 { grid-column: span 8; } .c-12 { grid-column: span 12; }
.card {
  position: relative; min-width: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-sm); padding: 22px;
}
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.card-head h2 { font-size: 18px; font-weight: 600; }
.card-head .sub { color: var(--muted); font-size: 13px; }
.card-head .end { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* hover dinâmico: spotlight que segue o cursor + leve elevação */
.spot { overflow: hidden; isolation: isolate; }
.spot::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
  background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%), var(--spot), transparent 65%);
  transition: opacity .3s;
}
.spot:hover::before { opacity: 1; }
.ink.spot::before { background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%), var(--spot-ink), transparent 65%); }
.lift { transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s, border-color .35s; }
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: transparent; }
}
.clickable { cursor: pointer; }

/* ---------- KPI ---------- */
.kpi { width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: left; font: inherit; color: inherit; }
.kpi-top { display: flex; align-items: center; gap: 12px; }
.kpi-ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); }
.kpi-label { font-size: 14px; font-weight: 600; color: var(--fg-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-go {
  margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--muted); transition: background .25s, color .25s, transform .25s;
}
.kpi:hover .kpi-go { background: var(--primary); color: #fff; transform: rotate(45deg); }
.kpi-num { font-size: 36px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.kpi-num small { font-size: 20px; color: var(--muted); font-weight: 500; }
.kpi-foot { font-size: 13px; color: var(--muted); margin-top: auto; }
.kpi-foot b { color: var(--fg); font-weight: 700; }
/* os quatro KPIs seguem a mesma grade: topo, número, faixa visual de altura fixa, rodapé.
   Assim número, gráfico e rodapé ficam na mesma linha nos quatro cards. */
.kpi-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.kpi-vis { height: 56px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
/* barra de status empilhada (pendente | em trânsito | entregue) */
.sbar { display: flex; gap: 3px; height: 10px; border-radius: var(--pill); overflow: hidden; }
.sbar i { display: block; height: 100%; min-width: 6px; transition: flex-grow .6s cubic-bezier(.2, .8, .2, 1); }
.sbar-key { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.sbar-key span { display: inline-flex; align-items: center; gap: 5px; }
.sbar-key i { width: 7px; height: 7px; border-radius: 50%; }

/* sparkline (traduzido do componente Sparkline do 21st.dev) */
.spark { position: relative; height: 56px; touch-action: pan-y; }
.spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
.spark-guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--primary); opacity: 0; left: 0; pointer-events: none; transition: transform .12s, opacity .15s; }
.spark-dot {
  position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--primary);
  left: 0; top: 0; box-shadow: 0 0 0 3px var(--surface); opacity: 0; pointer-events: none; transition: transform .12s, opacity .15s;
}
.spark.active .spark-guide { opacity: .25; }
.spark.active .spark-dot, .spark.active .tip { opacity: 1; }
.tip {
  position: absolute; z-index: 5; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--ink-fg); border-radius: var(--r-sm); padding: 6px 10px; font-size: 12px; font-weight: 600;
  white-space: nowrap; box-shadow: var(--shadow-md); transition: opacity .15s, left .12s, top .12s;
  border: 1px solid var(--ink-border);
}
.tip span { color: var(--ink-muted); font-weight: 500; margin-right: 6px; }

/* mini barras (traduzido do Stats Card do 21st.dev) */
.mbars { position: relative; display: flex; align-items: flex-end; gap: 8px; height: 56px; }
.mbar { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default; }
.mbar i {
  display: block; width: 100%; height: var(--h); border-radius: 8px 8px 4px 4px; background: var(--primary-soft);
  transform-origin: bottom; transition: background .2s;
}
.mbar.hi i { background: var(--primary); }
.mbar:hover i { background: var(--primary-strong); }
.mbars .tip { opacity: 0; }
.mbars.active .tip { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .grow .mbar i { animation: grow .7s cubic-bezier(.2, .9, .3, 1.15) both; animation-delay: calc(var(--i) * 60ms); }
}
@keyframes grow { from { transform: scaleY(.04); } }

/* anel de conclusão */
.ring-row { display: flex; align-items: center; gap: 16px; }
.ring { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.ring .track { stroke: var(--surface-3); }
.ring .val { stroke: var(--green); transition: stroke-dashoffset .9s cubic-bezier(.2, .8, .2, 1); }
.segbar { display: flex; gap: 4px; }
.segbar i { flex: 1; height: 8px; border-radius: var(--pill); background: var(--surface-3); }
.segbar i.on { background: var(--primary); }

/* ---------- gráfico de fluxo semanal ---------- */
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend i.line { width: 14px; height: 3px; border-radius: 2px; }
.fill { display: flex; flex-direction: column; }
/* resumo da semana acima do gráfico: o número que importa vem antes do desenho */
.flow-sum { display: flex; gap: 28px; flex-wrap: wrap; margin: -4px 0 24px; }
.flow-sum small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.flow-sum b { font-size: 22px; font-weight: 600; line-height: 1.2; }
.flow-sum b span { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; }
/* área do gráfico: eixo Y à esquerda, plotagem flexível à direita */
.flow { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; flex: 1; min-height: 200px; outline-offset: 6px; border-radius: var(--r-sm); }
.flow-y { position: relative; }
.flow-y span { position: absolute; right: 0; transform: translateY(50%); font-size: 12px; color: var(--muted); }
.flow-plot { position: relative; touch-action: pan-y; cursor: crosshair; }
.flow-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.flow-grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); pointer-events: none; }
.flow-grid.base { border-top-color: color-mix(in srgb, var(--fg) 18%, transparent); }
.f-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.f-line.a { stroke: var(--ch-a); } .f-line.b { stroke: var(--ch-b); }
/* pontos: HTML posicionado em %, assim continuam redondos em qualquer largura */
.fdot { position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface); pointer-events: none; }
.fdot.a { background: var(--ch-a); } .fdot.b { background: var(--ch-b); }
.fdot.hov { opacity: 0; transition: opacity .15s; }
.flow-guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--fg); opacity: 0; pointer-events: none; transition: opacity .15s; }
.flow.active .flow-guide { opacity: .14; }
.flow.active .fdot.hov { opacity: 1; }
.flow.active .fdot.end { opacity: .35; }
.flow .tip { opacity: 0; transform: translate(-50%, calc(-100% - 14px)); }
.flow .tip.ini { transform: translate(-12px, calc(-100% - 14px)); }
.flow .tip.fim { transform: translate(calc(-100% + 12px), calc(-100% - 14px)); }
.flow.active .tip { opacity: 1; }
.tip .row { display: flex; align-items: center; gap: 8px; color: var(--ink-fg); font-weight: 600; }
.tip .row i { width: 10px; height: 3px; border-radius: 2px; }
.tip .row em { font-style: normal; color: var(--ink-muted); font-weight: 500; margin-left: auto; padding-left: 14px; }
.tip .day { display: block; color: var(--ink-muted); font-weight: 500; margin-bottom: 4px; }
.flow-x { position: relative; height: 20px; margin-left: 36px; margin-top: 8px; }
.flow-x span { position: absolute; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; }
.flow-x span.hoje { color: var(--fg); font-weight: 600; }
/* entrada: as linhas "se desenham" da esquerda para a direita */
@media (prefers-reduced-motion: no-preference) {
  .flow.grow svg { animation: revela 1s cubic-bezier(.3, .8, .25, 1) both; }
  .flow.grow .fdot.end { animation: fade .3s ease .85s both; }
}
@keyframes revela { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* ---------- donut de status ---------- */
.donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.donut { position: relative; width: 168px; height: 168px; flex: none; margin-inline: auto; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 18; transition: stroke-width .2s, opacity .2s; }
.donut .seg-arc { cursor: pointer; }
.donut.hovering .seg-arc { opacity: .35; }
.donut.hovering .seg-arc.hl { opacity: 1; stroke-width: 22; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-center b { font-size: 34px; font-weight: 600; line-height: 1; }
.donut-center span { font-size: 12px; color: var(--muted); margin-top: 4px; }
.dlegend { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }
.dlegend button {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-radius: var(--r-md);
  background: var(--surface-2); text-align: left; transition: background .2s, transform .2s;
}
.dlegend button:hover, .dlegend button.hl { background: var(--surface-3); transform: translateX(3px); }
.dlegend i { width: 10px; height: 10px; border-radius: 50%; }
.dlegend .lbl { flex: 1; font-weight: 600; font-size: 13px; }
.dlegend .val { font-weight: 700; }

/* ---------- atividade (ref. Live Activity Feed do Behance) ---------- */
.feed { display: flex; flex-direction: column; gap: 6px; }
.feed-item {
  display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: var(--r-lg);
  transition: background .2s;
}
.feed-item:hover { background: var(--surface-2); }
.feed-ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.feed-ico.pend { background: var(--amber-soft); color: var(--amber-ink); }
.feed-ico.tran { background: var(--indigo-soft); color: var(--indigo-ink); }
.feed-ico.entr { background: var(--green-soft); color: var(--green-ink); }
.feed-txt { flex: 1; min-width: 0; }
.feed-txt b { display: block; font-weight: 700; font-size: 14px; line-height: 1.35; }
.feed-txt span { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-end { display: flex; align-items: center; gap: 12px; flex: none; }
.feed-time { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* ---------- painel escuro (ref. Unpaid Invoices da Finnova) ---------- */
.ink { background: var(--ink); color: var(--ink-fg); border-color: var(--ink-border); }
.ink .card-head .sub, .ink .muted { color: var(--ink-muted); }
.ink-list { display: flex; flex-direction: column; gap: 6px; }
.ink-item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border: 0; border-radius: var(--r-lg);
  background: transparent; color: var(--ink-fg); text-align: left; transition: background .2s, transform .2s;
}
.ink-item:hover { background: var(--ink-2); }
.ink-item.sel { background: linear-gradient(140deg, var(--detail-a), var(--detail-b)); box-shadow: 0 10px 26px rgba(91, 76, 240, .45); }
.ink-item .t { flex: 1; min-width: 0; }
.ink-item .t b { display: block; font-weight: 700; font-size: 14px; line-height: 1.35; }
.ink-item .t span { display: block; font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ink-item.sel .t span { color: rgba(255, 255, 255, .78); }
.ink-pin { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--ink-2); color: var(--ink-muted); flex: none; }
.ink-item.sel .ink-pin { background: rgba(255, 255, 255, .18); color: #fff; }
.ink .chip.pend { background: rgba(242, 172, 17, .16); color: #f6c24d; }
.ink .chip.tran { background: rgba(122, 108, 255, .22); color: #c4bdff; }
.ink .chip.entr { background: rgba(54, 209, 97, .16); color: #6fe397; }
.ink-item.sel .chip { background: rgba(255, 255, 255, .92); color: #2a2470; }
.ink-item.sel .chip::before { background: currentColor; }
.ink-empty { padding: 28px 12px; text-align: center; color: var(--ink-muted); }
.ink-free { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--ink-2); display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.ink .ink-free { margin-top: auto; }
.free-list { display: flex; flex-wrap: wrap; gap: 8px; }
.free { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: var(--pill); background: var(--ink-2); font-weight: 600; font-size: 13px; }
.ink-list + .ink-free { margin-top: auto; }

/* ---------- detalhe índigo (ref. Invoice details da Finnova) ---------- */
.detail {
  position: relative; overflow: hidden; border-radius: var(--r-xl); padding: 26px; color: #fff; min-width: 0;
  background: linear-gradient(150deg, var(--detail-a), var(--detail-b));
  box-shadow: 0 22px 50px rgba(75, 60, 230, .35);
}
.detail::after {
  content: ""; position: absolute; width: 380px; height: 380px; right: -140px; top: -170px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .22), transparent 65%); pointer-events: none;
}
.d-top { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.d-id { font-size: 30px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.d-sub { color: rgba(255, 255, 255, .78); font-size: 14px; margin-top: 4px; }
.d-top .chip { margin-left: auto; background: rgba(255, 255, 255, .95); color: #2a2470; }
.d-top .chip::before { background: currentColor; }
.d-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
.d-tile { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .16); border-radius: var(--r-lg); padding: 14px; min-width: 0; transition: background .2s; }
.d-tile:hover { background: rgba(255, 255, 255, .18); }
.d-tile small { display: block; font-size: 12px; color: rgba(255, 255, 255, .75); margin-bottom: 6px; }
.d-tile b { display: block; font-size: 15px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.steps { display: flex; align-items: center; margin-top: 22px; }
.step { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, .65); white-space: nowrap; }
.step i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(255, 255, 255, .4); font-style: normal; font-size: 12px; }
.step.done, .step.now { color: #fff; }
.step.done i { background: #fff; color: #4b3ce6; border-color: #fff; }
.step.now i { border-color: #fff; box-shadow: 0 0 0 5px rgba(255, 255, 255, .18); }
.step-txt { display: flex; flex-direction: column; line-height: 1.25; }
.step-txt small { font-size: 12px; font-weight: 500; opacity: .78; font-variant-numeric: tabular-nums; }
.step-line { flex: 1; height: 2px; margin: 0 10px; background: rgba(255, 255, 255, .25); border-radius: 2px; min-width: 14px; }
.step-line.done { background: #fff; }
.d-foot {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; padding: 14px;
  border-radius: var(--r-lg); background: rgba(13, 10, 60, .28);
}
.d-foot .note { color: rgba(255, 255, 255, .85); font-size: 13px; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.d-select {
  height: 44px; min-width: 190px; padding: 0 16px; border-radius: var(--pill); border: 1px solid rgba(255, 255, 255, .35);
  background: rgba(255, 255, 255, .14); color: #fff; outline: none;
}
.d-select option { color: #161a33; }
.d-select:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.d-del { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); background: transparent; color: #fff; display: grid; place-items: center; transition: background .2s; }
.d-del:hover { background: rgba(240, 71, 92, .85); border-color: transparent; }
.detail .err { color: #ffd4da; font-size: 12px; width: 100%; }
.detail-empty { display: grid; place-items: center; text-align: center; min-height: 320px; color: rgba(255, 255, 255, .85); }

/* ---------- toolbar de página ---------- */
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.toolbar .end { margin-left: auto; display: flex; gap: 10px; }

/* ---------- tabela (clientes) ---------- */
.table-wrap { overflow-x: auto; margin: 0 -8px; }
table { width: 100%; border-collapse: separate; border-spacing: 0 4px; min-width: 620px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 16px; white-space: nowrap; }
td { padding: 12px 16px; background: transparent; transition: background .2s; }
tbody tr td:first-child { border-radius: var(--r-lg) 0 0 var(--r-lg); }
tbody tr td:last-child { border-radius: 0 var(--r-lg) var(--r-lg) 0; }
tbody tr:hover td { background: var(--surface-2); }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.who b { display: block; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.who span { display: block; font-size: 12px; color: var(--muted); }
.row-acts { display: flex; justify-content: flex-end; gap: 4px; opacity: .6; transition: opacity .2s; }
tr:hover .row-acts, .row-acts:focus-within { opacity: 1; }
@media (hover: none) { .row-acts { opacity: 1; } }
.empty { padding: 36px 12px; text-align: center; color: var(--muted); }
.empty .ic { width: 28px; height: 28px; margin-bottom: 8px; }

/* ---------- motoristas em cards ---------- */
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.dcard { display: flex; flex-direction: column; gap: 16px; }
.dcard-top { display: flex; align-items: center; gap: 14px; }
.dcard-top .t { min-width: 0; flex: 1; }
.dcard-top b { display: block; font-size: 16px; font-weight: 700; line-height: 1.3; }
.dcard-meta { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--fg-2); }
.dcard-meta span { display: flex; align-items: center; gap: 8px; }
.dcard-meta .ic { width: 16px; height: 16px; color: var(--muted); }
.dstats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dstat { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; }
.dstat small { display: block; font-size: 12px; color: var(--muted); }
.dstat b { font-size: 20px; font-weight: 600; }
.dcard-acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: -6px; }
.add-tile {
  display: grid; place-items: center; text-align: center; gap: 10px; min-height: 260px; border: 2px dashed var(--border);
  border-radius: var(--r-xl); background: transparent; color: var(--muted); font-weight: 600;
  transition: border-color .25s, color .25s, background .25s;
}
.add-tile:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.add-tile .plus { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm); margin-inline: auto; }

/* ---------- master-detail ---------- */
.md { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }

/* ---------- aviso de demonstração ---------- */
.demo {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: var(--pill);
  background: var(--primary-soft); color: var(--indigo-ink); font-size: 13px; font-weight: 600; width: fit-content; max-width: 100%;
}

.demo.off { background: var(--amber-soft); color: var(--amber-ink); }
/* esqueleto de carregamento: mostra a forma da tela enquanto a API responde */
.skel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.skel i { display: block; height: 168px; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--border); position: relative; overflow: hidden; }
.skel i.big { grid-column: span 3; height: 300px; } .skel i.mid { height: 300px; }
.skel i::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--fg) 6%, transparent), transparent); animation: brilho 1.3s ease-in-out infinite; }
@keyframes brilho { to { transform: translateX(100%); } }
@media (max-width: 860px) { .skel { grid-template-columns: 1fr 1fr; } .skel i.big { grid-column: span 2; } .skel i.mid { display: none; } }

/* ---------- modal ---------- */
.modal-back { overscroll-behavior: contain; position: fixed; inset: 0; z-index: 80; background: var(--scrim); display: grid; place-items: center; padding: 16px; animation: fade .18s ease; }
.modal {
  overscroll-behavior: contain; width: 100%; max-width: 460px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface);
  border-radius: var(--r-xl); box-shadow: var(--shadow-lg); animation: pop .22s cubic-bezier(.2, .9, .3, 1.1);
}
.modal-head { display: flex; align-items: center; gap: 12px; padding: 22px 22px 6px; }
.modal-head h2 { font-size: 20px; font-weight: 700; }
.modal-head .icon-act { margin-left: auto; }
.modal-body { padding: 14px 22px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 8px 22px 22px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.field input, .field select {
  color: var(--fg); height: 46px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-2);
  outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
}
.field input:focus, .field select:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-soft); }
.field.bad input, .field.bad select { border-color: var(--danger); }
.field .err { font-size: 12px; color: var(--danger-ink); min-height: 0; }
.field .hint { font-size: 12px; color: var(--muted); }
.toggle { display: inline-flex; gap: 4px; padding: 4px; border-radius: var(--pill); background: var(--surface-2); border: 1px solid var(--border); width: fit-content; }
.toggle button { height: 36px; padding: 0 18px; border: 0; border-radius: var(--pill); background: transparent; font-weight: 600; color: var(--fg-2); }
.toggle button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } }

/* ---------- toast ---------- */
.toasts { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 10px; }
.toast {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--r-md); background: var(--ink); color: var(--ink-fg);
  font-weight: 600; font-size: 14px; box-shadow: var(--shadow-lg); animation: pop .22s ease; max-width: min(380px, calc(100vw - 40px));
}
.toast .ic { color: var(--green); }
.toast.bad .ic { color: var(--danger); }

/* =====================================================================
   COMPONENTES 21st.dev (portados de React/Tailwind para CSS puro)
   ===================================================================== */

/* ---------- Glowing Effect (Aceternity / 21st.dev) ----------
   Um arco de luz percorre a borda do card na direção do cursor.
   Técnica do original: um pseudo-elemento com o gradiente, recortado
   por duas máscaras (padding-box x border-box) para sobrar só a borda,
   e uma terceira máscara cônica que deixa acesa só a fatia apontada
   para o cursor. --start (ângulo) e --active são atualizados pelo JS. */
.glow { position: relative; }
.glow > .glow-ring {
  --start: 0; --active: 0; --spread: 34;
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
}
.glow > .glow-ring::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
  background: conic-gradient(from 210deg, var(--glow-a), var(--glow-b), var(--glow-c), var(--glow-a));
  /* camada 1: fatia cônica voltada para o cursor
     camada 2 x 3: caixa inteira menos o miolo = só o anel da borda */
  -webkit-mask:
    conic-gradient(from calc((var(--start) - var(--spread)) * 1deg), #0000 0deg, #000, #0000 calc(var(--spread) * 2deg)) border-box,
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0) border-box;
  -webkit-mask-composite: source-in, xor;
  mask:
    conic-gradient(from calc((var(--start) - var(--spread)) * 1deg), #0000 0deg, #000, #0000 calc(var(--spread) * 2deg)) border-box,
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0) border-box;
  mask-composite: intersect, exclude;
  opacity: var(--active); transition: opacity .35s ease;
}
/* toque e movimento reduzido: sem arco, só a borda acesa no foco */
@media (hover: none), (prefers-reduced-motion: reduce) { .glow > .glow-ring { display: none; } }
.glow:focus-visible { outline-offset: 3px; }

/* ---------- Border Beam (Magic UI / 21st.dev) ----------
   Um feixe curto anda pela borda do container. Aqui ele só aparece na
   fila de despacho quando há entrega esperando motorista: o movimento
   avisa "isto pede ação" e some quando a fila zera. */
.beam { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1; padding: 1.5px;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0) border-box;
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0) border-box;
  mask-composite: exclude;
}
.beam i {
  position: absolute; width: 120px; aspect-ratio: 1;
  background: linear-gradient(to left, var(--beam-a), var(--beam-b), transparent);
  offset-path: rect(0 auto auto 0 round 26px); offset-distance: 0%;
  animation: beam 7s linear infinite;
}
@keyframes beam { to { offset-distance: 100%; } }
@supports not (offset-path: rect(0 auto auto 0)) { .beam { display: none; } }
@media (prefers-reduced-motion: reduce) { .beam { display: none; } }

/* ---------- abas com indicador deslizante ----------
   O fundo escuro do botão ativo vira um elemento só, que desliza entre
   as opções (padrão "animated tabs" do 21st.dev) em vez de piscar. */
.seg { position: relative; isolation: isolate; }
.seg-ind {
  position: absolute; z-index: -1; top: 4px; left: 0; height: 36px; border-radius: var(--pill);
  background: var(--seg-on); box-shadow: 0 6px 16px rgba(22, 26, 51, .18);
  transition: transform .38s cubic-bezier(.2, .9, .25, 1), width .38s cubic-bezier(.2, .9, .25, 1);
}
.seg.ready button.on { background: transparent; }
.seg button { position: relative; }

/* ---------- interação nas linhas de lista ---------- */
.feed-item .feed-ico { transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.feed-item:hover .feed-ico { transform: scale(1.06) rotate(-4deg); }
.ink-item:hover .ink-pin, .ink-item:hover .av { transform: scale(1.05); }
.ink-item .ink-pin, .ink-item .av { transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.ink-item:active, .feed-item:active, .ccard:active { transform: scale(.99); }
tbody tr { transition: box-shadow .2s; }
tbody tr td:first-child { box-shadow: inset 3px 0 0 transparent; transition: background .2s, box-shadow .2s; }
tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--primary); }

/* ---------- motoristas no painel escuro (fila de despacho) ---------- */
.crew { display: flex; flex-direction: column; gap: 4px; }
.crew-row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: var(--r-md); font-size: 13px; }
.crew-row b { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crew-row .st { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
.crew-row .st.livre { color: #6fe3b0; }

/* ---------- cartão de modo demonstração na sidebar ---------- */
.side-card {
  margin: 4px 2px 0; padding: 14px; border-radius: var(--r-lg); background: var(--surface-2);
  border: 1px solid var(--border); font-size: 12px; color: var(--fg-2); display: flex; flex-direction: column; gap: 8px;
}
.side-card b { font-size: 13px; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.side-card b::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.side-card code { font: 600 11.5px/1.4 var(--font); color: var(--primary); overflow-wrap: anywhere; }
:is(.app.collapsed, .app.rail) .side-card { display: none; }
.side-reset { margin-top: 2px; height: 34px; border-radius: var(--pill); border: 1px solid var(--border); background: var(--surface);
  color: var(--fg-2); font-weight: 600; font-size: 12px; transition: border-color .2s, color .2s; }
.side-reset:hover { border-color: var(--primary); color: var(--primary); }
/* conectado à API: o ponto do cartão fica verde */
.side-card.api b::before { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }

/* ---------- resumo do topo das telas de cadastro ---------- */
.mini-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.mstat { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.mstat .kpi-ico { width: 40px; height: 40px; flex: none; }
.mstat small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.mstat b { font-size: 22px; font-weight: 600; line-height: 1.2; }
.mstat b span { font-size: 14px; color: var(--muted); font-weight: 500; }

/* ---------- clientes em cartões (só no celular) ---------- */
.ccards { display: none; flex-direction: column; gap: 10px; }
.ccard { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r-lg); background: var(--surface-2); }
.ccard .t { flex: 1; min-width: 0; }
.ccard .t b { display: block; font-weight: 700; line-height: 1.3; overflow-wrap: break-word; }
.ccard .t span { display: block; font-size: 12px; color: var(--muted); }
.ccard .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.ccard .meta .chip { height: 24px; padding: 0 10px; font-size: 12px; }
.ccard .acts { display: flex; gap: 2px; }

/* ---------- barra de abas inferior (celular) ---------- */
.tabbar { display: none; }

/* ---------- detalhe como folha deslizante (telas estreitas) ---------- */
.sheet-close { display: none; }

/* ---------- scrim mobile ---------- */
.scrim { display: none; }

/* ---------- responsivo ----------
   > 1100px  sidebar inteira (o usuário pode recolher)
   641-1100  trilho de ícones fixo, com tooltip (padrão "navigation rail")
   <= 640    barra de abas inferior; sidebar some
   <= 1024   o detalhe da entrega abre como folha deslizante sobre a lista */
@media (max-width: 1240px) {
  .c-3 { grid-column: span 6; }
  .c-4, .c-5, .c-7, .c-8 { grid-column: span 12; }
  .search { width: 220px; }
}
@media (max-width: 1100px) {
  .collapse-btn { display: none; }
  .side-foot { border-top: 0; }
}
@media (max-width: 1024px) {
  .md { grid-template-columns: 1fr; }
  /* detalhe vira folha: sobe de baixo e cobre a lista, sem perder o lugar nela */
  .md .detail {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 70;
    max-height: calc(100vh - 96px); overflow-y: auto; overscroll-behavior: contain;
    transform: translateY(calc(100% + 40px)); visibility: hidden;
    transition: transform .38s cubic-bezier(.2, .9, .25, 1), visibility 0s linear .38s;
  }
  .md.sheet-open .detail { transform: none; visibility: visible; transition: transform .38s cubic-bezier(.2, .9, .25, 1); }
  .md .detail-empty { display: none; }
  .sheet-back { position: fixed; inset: 0; z-index: 65; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .md.sheet-open .sheet-back { opacity: 1; pointer-events: auto; }
  .md .detail .d-top { padding-right: 52px; }
  .md .detail .d-top .chip { margin-left: 0; }
  .sheet-close {
    position: absolute; top: 18px; right: 18px; z-index: 3;
    display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; flex: none;
    border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .14); color: #fff;
  }
  .sheet-grip { display: block; width: 44px; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .45); margin: -10px auto 14px; }
}
@media (min-width: 1025px) { .sheet-back, .sheet-grip { display: none; } }
/* com a sidebar inteira aberta, o cartão dela já avisa do modo demonstração */
@media (min-width: 1101px) { .app:not(.collapsed) #demoBanner { display: none; } }
@media (max-width: 860px) {
  .mini-stats { grid-template-columns: 1fr 1fr; }
  .mini-stats .mstat:last-child { grid-column: span 2; }
}
@media (max-width: 640px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .sidebar { display: none; }
  .tabbar {
    display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 50;
    padding: 6px; gap: 4px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-xl); box-shadow: var(--shadow-md);
  }
  .tabbar a {
    position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 4px 7px; border-radius: var(--r-lg); color: var(--muted); font-size: 11px; font-weight: 600;
    transition: background .2s, color .2s;
  }
  .tabbar a.active { background: var(--primary-soft); color: var(--primary); }
  .tabbar .nav-badge { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 18px; height: 18px; font-size: 11px; padding: 0 5px; margin: 0; }
  .icon-btn.menu-btn { display: none; }
  .md .detail { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); max-height: calc(100vh - 170px); }

  .c-3 { grid-column: span 6; }
  .bento { gap: 12px; }
  .topbar { gap: 10px; }
  .title-block { flex: 1; }
  .title-block h1 { font-size: 24px; }
  .title-block p { font-size: 13px; }
  .top-actions { display: contents; }
  .search { order: 3; width: 100%; height: 42px; }
  .icon-btn { width: 40px; height: 40px; }
  .card { padding: 16px; }
  .kpi { gap: 10px; }
  .kpi-go { display: none; }
  .kpi-ico { width: 32px; height: 32px; }
  .kpi-ico .ic { width: 16px; height: 16px; }
  .kpi-label { font-size: 13px; }
  .kpi-num { font-size: 30px; }
  .kpi-num small { font-size: 16px; }
  .ring { width: 40px; height: 40px; }
  .kpi-vis, .spark, .mbars { height: 44px; }
  .sbar-key { display: none; }
  .mbars { gap: 5px; }
  .card-head { flex-wrap: wrap; }
  .card-head .end.legend { margin-left: 0; width: 100%; }
  .flow { min-height: 170px; }
  .flow-sum { gap: 18px; margin-bottom: 14px; }
  .flow-sum b { font-size: 19px; }
  .feed-item { padding: 10px 4px; gap: 12px; }
  .feed-ico { width: 38px; height: 38px; border-radius: 12px; }
  .d-tiles { grid-template-columns: 1fr; }
  .detail { padding: 20px; }
  .d-id { font-size: 26px; }
  .steps { align-items: flex-start; }
  .step { flex-direction: column; gap: 6px; font-size: 11.5px; }
  .step-line { margin-top: 12px; margin-inline: 6px; }
  .d-tile { padding: 12px 14px; }
  .d-tiles { gap: 8px; }
  /* rodapé de ação: cada controle numa linha cheia */
  .d-foot .note { width: 100%; }
  .d-select { width: 100%; flex: 1 1 100%; }
  .d-foot .btn-white { flex: 1; }

  .toolbar .end { margin-left: 0; width: 100%; flex-wrap: wrap; }
  /* dividem a linha quando cabem; em tela estreita cada botao ocupa a linha inteira */
  .toolbar .end .btn { flex: 1 1 auto; }
  /* filtros: uma linha só, rolando de lado, com borda esmaecida avisando que há mais */
  .toolbar .seg { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent); }
  .toolbar .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; }
  .table-wrap { display: none; }
  .ccards { display: flex; }
  .mini-stats, .mini-stats .mstat:last-child { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-column: auto; }
  .mini-stats { gap: 8px; }
  .mstat { padding: 12px; gap: 6px; flex-direction: column; align-items: flex-start; }
  .mstat .kpi-ico { display: none; }
  .mstat small { font-size: 12px; line-height: 1.3; }
  .mstat b { font-size: 20px; }
  /* a lista de clientes deixa de ser card dentro de card */
  .list-card { background: transparent; border: 0; box-shadow: none; padding: 0; }
  .list-card .ccard { background: var(--surface); border: 1px solid var(--border); }
  .dgrid { grid-template-columns: 1fr; gap: 12px; }
  .add-tile { min-height: 120px; }
  .toasts { left: 12px; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .toast { max-width: none; }
  .modal-back { place-items: end center; padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .modal-foot .btn { flex: 1; }
}
/* =====================================================================
   NOTAS FISCAIS
   ===================================================================== */
.ic-xs { width: 13px; height: 13px; }
/* aviso de "sem internet": centralizado pelas duas bordas (left/right + margin auto), assim a largura
   acompanha o texto sem encolher para metade da tela no celular */
.sem-rede { position: fixed; top: 12px; left: 12px; right: 12px; margin-inline: auto; width: fit-content; z-index: 95; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: var(--pill); background: var(--danger); color: #fff; font-weight: 600; font-size: 13px; box-shadow: var(--shadow-lg); }
.v-curto { display: none; }
@media (max-width: 640px) {
  .v-full { display: none; } .v-curto { display: inline; }
  .sem-rede { border-radius: 14px; line-height: 1.35; }
  /* rotulos dos indicadores quebram em duas linhas em vez de cortar com "..." */
  .kpi-label { white-space: normal; line-height: 1.25; }
}
/* celulares bem estreitos (ex.: 360 px): um pouco menos de respiro para "Cadastradas" caber inteiro */
@media (max-width: 400px) {
  .kpi.card { padding: 14px; }
  .kpi-top { gap: 8px; }
  .kpi-ico { width: 28px; height: 28px; flex: none; }
}
.nf-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--primary-soft); color: var(--primary); }
.cel-b { display: block; font-weight: 700; line-height: 1.3; }
.cel-s { display: block; font-size: 12px; color: var(--muted); }
.link-ent { border: 0; background: none; padding: 0; font-weight: 700; color: var(--primary); }
.link-ent:hover { text-decoration: underline; }
.chip.ia { background: var(--primary-soft); color: var(--indigo-ink); gap: 5px; }
.chip.ia::before { display: none; }

/* estado vazio com chamada para a nota de exemplo */
.nf-vazio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 36px 16px; }
.nf-vazio h2 { font-size: 20px; font-weight: 700; }
.nf-vazio p { color: var(--fg-2); max-width: 520px; text-wrap: pretty; }
.nf-vazio-ico { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(140deg, var(--detail-a), var(--detail-b)); box-shadow: var(--shadow-primary); }
.nf-vazio-ico .ic { width: 28px; height: 28px; }
.nf-vazio-acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }

/* modal largo (enviar, ler e revisar a nota) */
.modal.wide { max-width: 1080px; }
.nf-rodape { display: contents; }
.nf { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; align-items: start; }
.nf-prev-wrap { position: sticky; top: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.nf-prev-wrap > summary { display: none; }
.nf-prev { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: auto; max-height: min(68vh, 640px); }

.nf-prev.vazio { display: grid; place-items: center; gap: 8px; min-height: 220px; color: var(--muted); text-align: center; padding: 20px; border-style: dashed; }

.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 34px 20px; cursor: pointer;
  border: 2px dashed var(--border); border-radius: var(--r-lg); background: var(--surface-2); color: var(--fg-2);
  transition: border-color .2s, background .2s; }
.drop:hover, .drop.over, .drop:focus-within { border-color: var(--primary); background: var(--primary-soft); }
.drop b { color: var(--fg); font-size: 15px; }
.drop span { font-size: 13px; }
.drop .err { color: var(--danger-ink); font-weight: 600; }
.drop-ico { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm); color: var(--primary); margin-bottom: 4px; }
.nf-ou { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; font-weight: 600; }

  background: linear-gradient(140deg, var(--detail-a), var(--detail-b)); box-shadow: var(--shadow-primary); }

@media (prefers-reduced-motion: no-preference) { .nf-pulse:not(.erro) { animation: pulso 1.6s ease-in-out infinite; } }
@keyframes pulso { 50% { transform: scale(1.08); box-shadow: 0 0 0 10px var(--primary-soft); } }
.nf-etapas { list-style: none; margin: 6px 0 4px; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }
.nf-etapas li { display: flex; align-items: center; gap: 10px; }

<script>
/* =====================================================================
   CAMADA DE DADOS — conversa com a MiniErpApi (C#).
   - Cada visitante tem uma SESSÃO própria (sandbox): o front pede
     GET /sessao, guarda o Id nesta aba e envia "X-Sessao" em toda chamada.
     Fechou a aba, a próxima visita começa com os dados originais.
   - Leituras (listar/achar) são síncronas: vêm de um cache em memória.
   - Alterações são async: chamam a API e recarregam o cache.
     Devolvem { ok, dado } ou { erro, campos } (campos = erros por campo).
   - Se a API não responder, entra o MODO DEMONSTRAÇÃO: um "servidor
     falso" no navegador, com as mesmas regras e mensagens da API.
     Endpoints usados:
       GET /sessao             POST /sessao/reiniciar
       GET/POST /clientes      PUT/DELETE /clientes/{id}
       GET/POST /motoristas    PUT/DELETE /motoristas/{id}
       GET/POST /entregas      DELETE /entregas/{id}
       PUT /entregas/{id}  { status: "EmTransito" | "Entregue", motoristaId }
   ===================================================================== */

// Servido pela própria API (localhost ou Railway)? Usa a mesma origem.
// Aberto como arquivo ou como artifact? Tenta a API local na porta do projeto.
const API_BASE = location.protocol.startsWith("http") && !location.hostname.endsWith("claudeusercontent.com")
  ? location.origin
  : "http://localhost:5185";

// Erro padronizado: status HTTP, mensagem pronta para o usuário e erros por campo (se houver).
class ErroApi extends Error {
  constructor(status, msg, campos = null) { super(msg); this.status = status; this.campos = campos; }
}

const DB = (() => {
  let modo = "api";                                   // "api" | "demo"
  let cache = { clientes: [], motoristas: [], entregas: [], notas: [] };
  let sessaoId = null;

  // Id da sessão guardado só nesta aba (sessionStorage). Sem acesso? Segue sem guardar.
  const CHAVE = "rota-sessao";
  const aba = {
    ler() { try { return sessionStorage.getItem(CHAVE); } catch { return null; } },
    gravar(v) { try { sessionStorage.setItem(CHAVE, v); } catch {} },
  };

  /* ---------- chamada real à API ---------- */
  // Tempo máximo de espera por resposta: leitura por IA pode demorar (fila + 2 modelos); o resto é rápido
  const tempoLimite = rota => rota.endsWith("/interpretar") ? 100000 : rota.startsWith("/notas") && rota.length === 6 ? 45000 : 20000;

  async function http(metodo, rota, corpo) {
    const headers = {};
    const ehForm = corpo instanceof FormData;           // upload de arquivo: o navegador monta o multipart
    if (corpo && !ehForm) headers["Content-Type"] = "application/json";
    if (sessaoId) headers["X-Sessao"] = sessaoId;

    let r;
    const controle = new AbortController();
    const relogio = setTimeout(() => controle.abort(), tempoLimite(rota));
    try {
      r = await fetch(API_BASE + rota, { method: metodo, headers, signal: controle.signal, body: corpo ? (ehForm ? corpo : JSON.stringify(corpo)) : undefined });
    } catch (e) {
      if (e.name === "AbortError") throw new ErroApi(0, "O servidor demorou demais para responder. Tente de novo em instantes.");
      if (!navigator.onLine) throw new ErroApi(0, "Você está sem internet. Confira a conexão e tente de novo.");
      throw new ErroApi(0, "Não foi possível falar com o servidor agora. Tente de novo em instantes.");
    } finally {
      clearTimeout(relogio);
    }
    if (r.ok) return r.status === 204 ? null : r.json();

    // Erros chegam como Problem Details: "detail" (regra de negócio) ou "errors" (campos inválidos)
    let p = null;
    try { p = await r.json(); } catch { /* corpo vazio */ }
    if (r.status === 401) throw new ErroApi(401, "Sua sessão de demonstração expirou. Os dados foram reiniciados.");
    if (r.status === 429) throw new ErroApi(429, (p && p.detail) || "Muitas tentativas em pouco tempo. Aguarde alguns minutos.");
    if (r.status === 413) throw new ErroApi(413, (p && p.detail) || "O arquivo passou do limite de 5 MB. Use um arquivo menor.");
    if (p && p.errors) {
      const campos = {};
      for (const [k, v] of Object.entries(p.errors)) campos[k.charAt(0).toLowerCase() + k.slice(1)] = [].concat(v)[0];
      throw new ErroApi(r.status, Object.values(campos)[0], campos);
    }
    throw new ErroApi(r.status, (p && p.detail) || `A API recusou a operação (erro ${r.status}).`);
  }

  async function abrirSessao() {
    sessaoId = aba.ler();                               // reaproveita a da aba, se ainda valer
    const s = await http("GET", "/sessao");             // a API devolve a mesma ou cria uma nova
    sessaoId = s.id;
    aba.gravar(s.id);
  }

  /* ---------- "servidor falso" do modo demonstração ----------
     Mesmas rotas, regras e mensagens da API (Endpoints/*.cs). */
  let base = null;
  function semear() {
    // mesmo roteiro do Data/DadosDemo.cs: datas relativas a agora
    const agora = Date.now(), H = 3600e3, D = 24 * H, iso = t => new Date(t).toISOString();
    const clientes = [
      ["Maria Silva", 34, true], ["José Carlos", 41, true], ["Alberto Nóbrega", 58, false],
      ["Renata Lopes", 29, true], ["Distribuidora Piracicaba", 37, true], ["Ana Beatriz Costa", 27, true],
    ].map(([nome, idade, ativo], i) => ({ id: i + 1, nome, idade, ativo }));
    const motoristas = [
      ["João Souza", "12345678900", "(19) 99812-0451"], ["Pedro Ramos", "98765432100", "(19) 99734-2210"],
      ["Carlos Nunes", "45678912300", "(19) 99655-7782"], ["Lucas Ferreira", "32165498700", "(19) 99501-3348"],
    ].map(([nome, cnh, telefone], i) => ({ id: i + 1, nome, cnh, telefone }));
    const roteiro = [
      [0, "Rua das Flores, 123 - Centro, Limeira", 6.5, "Entregue", 0],
      [4, "Av. Campinas, 2200 - Distrito Industrial, Limeira", 6.4, "Entregue", 1],
      [1, "Av. Brasil, 890 - Jd. América, Limeira", 5.6, "Entregue", 2],
      [2, "Rua Sete de Setembro, 51 - Centro, Rio Claro", 5.5, "Entregue", 0],
      [3, "Rua XV de Novembro, 400 - Centro, Americana", 5.3, "Entregue", 1],
      [4, "Rod. Anhanguera, km 152 - Galpão 3, Limeira", 4.4, "Entregue", 2],
      [5, "Rua Gomes, 75 - Vila Nova, Piracicaba", 3.6, "Entregue", 0],
      [0, "Al. Santos, 12 - Boa Vista, Limeira", 3.5, "Entregue", 1],
      [1, "Rua Boa Morte, 980 - Centro, Limeira", 3.4, "Entregue", 2],
      [4, "Av. Independência, 1500 - Cidade Alta, Piracicaba", 3.2, "Entregue", 3],
      [3, "Rua Tiradentes, 310 - Vila Cláudia, Limeira", 2.5, "Entregue", 0],
      [5, "Rua do Rosário, 455 - Centro, Piracicaba", 2.3, "Entregue", 1],
      [0, "Av. Saudade, 1020 - Vila Glória, Limeira", 2.1, "Entregue", 2],
      [1, "Rua Treze de Maio, 77 - Centro, Rio Claro", 1.5, "Entregue", 3],
      [5, "Av. de Cillo, 2700 - Jd. Ipiranga, Americana", 1.2, "EmTransito", 2],
      [0, "Rua Barão de Campinas, 88 - Centro, Limeira", 0.7, "EmTransito", 1],
      [4, "Rua Carlos Gomes, 640 - Centro, Limeira", 0.5, "Entregue", 0],
      [1, "Rua Paraná, 230 - Vila Paulista, Limeira", 0.25, "Pendente", -1],
      [3, "Av. Major José Levy Sobrinho, 1200 - Limeira", 0.1, "Pendente", -1],
    ];
    const entregas = roteiro.map(([c, endereco, dias, status, m], i) => {
      const criada = agora - dias * D;
      return {
        id: i + 1, endereco, status, clienteId: c + 1, motoristaId: m >= 0 ? m + 1 : null,
        criadaEm: iso(criada),
        despachadaEm: status !== "Pendente" ? iso(criada + 3 * H) : null,
        entregueEm: status === "Entregue" ? iso(criada + 9 * H) : null,

    });

  }

  const nextId = arr => arr.reduce((m, x) => Math.max(m, x.id), 0) + 1;
  const recusar = msg => { throw new ErroApi(400, msg); };
  const invalido = campos => { throw new ErroApi(400, Object.values(campos)[0], campos); };
  const validarCliente = d => {
    const c = {};
    if (!String(d.nome || "").trim()) c.nome = "Informe o nome.";
    if (!(d.idade > 0 && d.idade <= 120)) c.idade = "Informe uma idade entre 1 e 120.";
    if (Object.keys(c).length) invalido(c);
  };
  const validarMotorista = d => {
    const c = {};
    if (!String(d.nome || "").trim()) c.nome = "Informe o nome.";
    if (String(d.cnh || "").replace(/\D/g, "").length !== 11) c.cnh = "A CNH precisa ter 11 dígitos.";
    if (Object.keys(c).length) invalido(c);
  };

  async function demo(metodo, rota, corpo) {
    const [, recurso, idTxt] = rota.split("/");
    if (recurso === "sessao") { base = semear(); return null; }      // POST /sessao/reiniciar
    if (recurso === "notas") return demoNotas(metodo, idTxt, rota.split("/")[3], corpo);
    const tab = base[recurso], id = Number(idTxt);
    const item = idTxt ? tab.find(x => x.id === id) : null;
    const nomes = { clientes: "Cliente não encontrado.", motoristas: "Motorista não encontrado.", entregas: "Entrega não encontrada." };
    if (idTxt && !item) throw new ErroApi(404, nomes[recurso]);

    if (metodo === "GET") {
      if (recurso !== "entregas") return structuredClone(tab);
      return [...tab].sort((a, b) => b.criadaEm.localeCompare(a.criadaEm)).map(e => ({
        ...e,
        cliente: base.clientes.find(c => c.id === e.clienteId) || null,
        motorista: base.motoristas.find(m => m.id === e.motoristaId) || null,
      }));
    }
    if (metodo === "POST") {
      if (recurso === "clientes") validarCliente(corpo);
      if (recurso === "motoristas") { validarMotorista(corpo); corpo = { ...corpo, cnh: corpo.cnh.replace(/\D/g, "") }; }
      if (recurso === "entregas") {
        if (String(corpo.endereco || "").trim().length < 5) invalido({ endereco: "Informe o endereço com rua, número e cidade." });
        const cli = base.clientes.find(c => c.id === corpo.clienteId);
        if (!cli) recusar("Cliente não encontrado.");
        if (!cli.ativo) recusar("Cliente inativo não pode receber entregas. Ative o cliente primeiro.");
        corpo = { endereco: corpo.endereco.trim(), clienteId: cli.id, status: "Pendente", motoristaId: null,
                  criadaEm: new Date().toISOString(), despachadaEm: null, entregueEm: null };
      }
      const novo = { ...corpo, id: nextId(tab) };
      tab.push(novo);
      return novo;
    }
    if (metodo === "PUT") {
      if (recurso === "entregas") {
        if (corpo.status === "EmTransito") {
          if (item.status !== "Pendente") recusar("Só uma entrega pendente pode ser despachada.");
          if (corpo.motoristaId == null) recusar("Para despachar é necessário escolher um motorista.");
          if (!base.motoristas.some(m => m.id === corpo.motoristaId)) recusar("Motorista não encontrado.");
          item.motoristaId = corpo.motoristaId; item.despachadaEm = new Date().toISOString();
        } else if (corpo.status === "Entregue") {
          if (item.status !== "EmTransito") recusar("Só uma entrega em trânsito pode ser marcada como entregue.");
          item.entregueEm = new Date().toISOString();
        } else recusar("Uma entrega não pode voltar para Pendente.");
        item.status = corpo.status;
      } else {
        if (recurso === "clientes") validarCliente(corpo);
        if (recurso === "motoristas") { validarMotorista(corpo); corpo = { ...corpo, cnh: corpo.cnh.replace(/\D/g, "") }; }
        Object.assign(item, corpo, { id });
      }

    }

      // proteção de integridade, igual à API
      if (recurso === "clientes" && base.entregas.some(e => e.clienteId === id)) recusar("Este cliente tem entregas vinculadas e não pode ser excluído. Exclua as entregas dele primeiro.");
      if (recurso === "entregas" && base.notas.some(n => n.entregaId === id)) recusar("Esta entrega tem nota fiscal vinculada e não pode ser excluída. Exclua a nota primeiro.");
      if (recurso === "motoristas" && base.entregas.some(e => e.motoristaId === id)) recusar("Este motorista tem entregas vinculadas e não pode ser excluído. Exclua as entregas dele primeiro.");

  }

  // (os valores dela são conhecidos). Para outros arquivos, o usuário preenche à mão.
  async function demoNotas(metodo, idTxt, sub, corpo) {
    const id = Number(idTxt);
    if (metodo === "GET" && !idTxt) {
      return base.notas.map(n => {
        const e = base.entregas.find(x => x.id === n.entregaId);
        const c = e && base.clientes.find(x => x.id === e.clienteId);
        return { ...n, itens: undefined, clienteNome: c ? c.nome : null, quantidadeItens: n.itens.length, temArquivo: !!base.arquivos[n.id] };
      }).sort((a, b) => b.criadaEm.localeCompare(a.criadaEm));
    }
    const nota = idTxt && idTxt !== "interpretar" ? base.notas.find(n => n.id === id) : null;
    if (idTxt && idTxt !== "interpretar" && !nota) throw new ErroApi(404, "Nota fiscal não encontrada.");
    if (metodo === "GET" && sub === "arquivo") { if (!base.arquivos[id]) throw new ErroApi(404, "Arquivo não encontrado."); return base.arquivos[id]; }
    if (metodo === "GET") return structuredClone(nota);
    if (metodo === "POST" && idTxt === "interpretar") {
      const arq = corpo.get("arquivo");
      await new Promise(r => setTimeout(r, 1800));                  // simula o tempo de leitura
      if (!arq || arq.name !== NOTA_EXEMPLO.arquivo) {
        throw new ErroApi(503, "No modo demonstração a leitura por IA só funciona com a nota de exemplo. Preencha os campos à mão ou use a nota de exemplo.");
      }
      const dados = structuredClone(NOTA_EXEMPLO.dados);
      return { dados, avisos: conferirNota(dados) };
    }
    if (metodo === "POST") {
      const d = JSON.parse(corpo.get("dados"));
      const bloq = conferirNota(d).filter(a => a.bloqueia);
      const campos = {};
      if (!String(d.numero || "").trim()) campos.numero = "Informe o número da nota.";
      if (!String(d.emitenteNome || "").trim()) campos.emitenteNome = "Informe o nome do emitente.";
      if (!(d.valorTotal > 0)) campos.valorTotal = "Informe o valor total da nota.";
      bloq.forEach(a => { campos[a.campo] ??= a.mensagem; });
      if (Object.keys(campos).length) invalido(campos);
      if (!base.entregas.some(e => e.id === d.entregaId)) recusar("Entrega não encontrada.");
      const nova = { ...d, id: nextId(base.notas), criadaEm: new Date().toISOString() };
      base.notas.push(nova);

  }

  // Escolhe o "servidor" de acordo com o modo atual.
  const chamar = (metodo, rota, corpo) => (modo === "api" ? http : demo)(metodo, rota, corpo);

  // Busca as três listas de uma vez e atualiza o cache.
  async function carregar() {
    const [clientes, motoristas, entregas, notas] = await Promise.all([
      chamar("GET", "/clientes"), chamar("GET", "/motoristas"), chamar("GET", "/entregas"), chamar("GET", "/notas"),

  }

  // Executa uma alteração e recarrega o cache. Nunca lança erro: devolve { erro, campos }.
  async function executar(metodo, rota, corpo) {

      const dado = await chamar(metodo, rota, corpo);
      await carregar();
      return { ok: true, dado };
    } catch (e) {

    async iniciar() {
      try { await abrirSessao(); await carregar(); }
      catch { modo = "demo"; base = semear(); await carregar(); }
      return modo;
    },
    modo: () => modo,
    recarregar: () => carregar(),

    reiniciar: () => executar("POST", "/sessao/reiniciar"),

    listarClientes: () => cache.clientes,
    acharCliente: id => cache.clientes.find(c => c.id === id),
    criarCliente: d => executar("POST", "/clientes", d),
    editarCliente: (id, d) => executar("PUT", `/clientes/${id}`, d),
    excluirCliente: id => executar("DELETE", `/clientes/${id}`),

    // ----- Motoristas -----
    listarMotoristas: () => cache.motoristas,
    acharMotorista: id => cache.motoristas.find(m => m.id === id),
    criarMotorista: d => executar("POST", "/motoristas", d),
    editarMotorista: (id, d) => executar("PUT", `/motoristas/${id}`, d),
    excluirMotorista: id => executar("DELETE", `/motoristas/${id}`),

    // ----- Entregas (já vêm com cliente e motorista, via Include na API) -----
    listarEntregas: () => cache.entregas,
    criarEntrega: d => executar("POST", "/entregas", d),
    atualizarStatusEntrega: (id, status, motoristaId) => executar("PUT", `/entregas/${id}`, { status, motoristaId }),
    excluirEntrega: id => executar("DELETE", `/entregas/${id}`),

    // ----- Notas fiscais -----
    listarNotas: () => cache.notas,
    // Leitura por IA: não salva nada, só devolve os campos lidos + avisos da conferência
    async lerNota(arquivo) {
      const fd = new FormData(); fd.append("arquivo", arquivo, arquivo.name);
      try { return { ok: true, dado: await chamar("POST", "/notas/interpretar", fd) }; }
      catch (e) { return { erro: e.message, status: e.status }; }
    },
    salvarNota(dados, arquivo) {
      const fd = new FormData(); fd.append("dados", JSON.stringify(dados));
      if (arquivo) fd.append("arquivo", arquivo, arquivo.name);
      return executar("POST", "/notas", fd);
    },
    buscarNota: async id => { try { return { ok: true, dado: await chamar("GET", `/notas/${id}`) }; } catch (e) { return { erro: e.message }; } },
    // Arquivo da nota como Blob (o <img> não envia o header de sessão, então baixamos via fetch)
    async arquivoNota(id) {
      if (modo === "demo") return await demo("GET", `/notas/${id}/arquivo`);
      const r = await fetch(`${API_BASE}/notas/${id}/arquivo`, { headers: sessaoId ? { "X-Sessao": sessaoId } : {} });
      if (!r.ok) throw new ErroApi(r.status, "Não foi possível abrir o arquivo da nota.");
      return r.blob();
    },
    excluirNota: id => executar("DELETE", `/notas/${id}`),
  };
})();

/* ---------- Notas fiscais: nota de exemplo e conferência ----------
   A conferência é a mesma regra do Services/ConferenciaNota.cs (C#), repetida aqui
   para os avisos mudarem na hora em que o usuário edita um campo. Ao salvar,

const NOTA_EXEMPLO = {
