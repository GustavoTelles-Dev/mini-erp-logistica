const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const BRL_CURTO = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", notation: "compact", maximumFractionDigits: 1 });
const soNumeros = t => String(t ?? "").replace(/\D/g, "");
const normalizarDoc = t => String(t ?? "").toUpperCase().replace(/[^0-9A-Z]/g, "");

// CNPJ numérico ou alfanumérico: cada caractere vale (código ASCII − 48), pesos 2..9 da direita para a esquerda
function cnpjValido(c) {
  if (c.length !== 14 || !/^[0-9A-Z]{12}\d{2}$/.test(c) || new Set(c).size === 1) return false;
  const dv = b => { let soma = 0, peso = 2; for (let i = b.length - 1; i >= 0; i--) { soma += (b.charCodeAt(i) - 48) * peso; peso = peso === 9 ? 2 : peso + 1; } const r = soma % 11; return r < 2 ? 0 : 11 - r; };
  const d1 = dv(c.slice(0, 12)), d2 = dv(c.slice(0, 12) + d1);
  return +c[12] === d1 && +c[13] === d2;
}
function cpfValido(c) {
  if (!/^\d{11}$/.test(c) || new Set(c).size === 1) return false;
  for (let t = 9; t < 11; t++) { let soma = 0; for (let i = 0; i < t; i++) soma += +c[i] * (t + 1 - i); if (+c[t] !== (soma * 10) % 11 % 10) return false; }
  return true;
}
// Chave de acesso: módulo 11 com pesos 2..9 sobre os 43 primeiros dígitos
function chaveValida(c) {
  let soma = 0, peso = 2;
  for (let i = 42; i >= 0; i--) { soma += +c[i] * peso; peso = peso === 9 ? 2 : peso + 1; }
  const r = soma % 11; return +c[43] === (r < 2 ? 0 : 11 - r);
}
function conferirNota(n) {
  const av = [], add = (campo, mensagem, bloqueia) => av.push({ campo, mensagem, bloqueia });
  const cnpj = normalizarDoc(n.emitenteCnpj), dest = normalizarDoc(n.destinatarioDocumento), chave = soNumeros(n.chaveAcesso);
  if (!cnpj) add("emitenteCnpj", "Informe o CNPJ do emitente.", true);
  else if (!cnpjValido(cnpj)) add("emitenteCnpj", "CNPJ do emitente inválido (os dígitos verificadores não conferem).", true);
  if (dest && !(dest.length === 11 ? cpfValido(dest) : cnpjValido(dest))) add("destinatarioDocumento", "CPF/CNPJ do destinatário inválido.", true);
  if (chave) {
    if (chave.length !== 44) add("chaveAcesso", `A chave de acesso tem 44 dígitos (foram lidos ${chave.length}).`, true);
    else if (!chaveValida(chave)) add("chaveAcesso", "Chave de acesso inválida (o dígito verificador não confere).", true);
    else {
      if (cnpj.length === 14 && chave.slice(6, 20) !== cnpj) add("emitenteCnpj", "O CNPJ do emitente não bate com o que está na chave de acesso.", false);
      if (/^\d+$/.test(String(n.serie ?? "").trim()) && +chave.slice(22, 25) !== +n.serie) add("serie", "A série não bate com a chave de acesso.", false);
      if (soNumeros(n.numero) && +chave.slice(25, 34) !== +soNumeros(n.numero)) add("numero", "O número da nota não bate com a chave de acesso.", false);
      if (n.dataEmissao && chave.slice(2, 6) !== n.dataEmissao.slice(2, 4) + n.dataEmissao.slice(5, 7)) add("dataEmissao", "O mês/ano de emissão não bate com a chave de acesso.", false);
    }
  }
  if (n.dataEmissao && new Date(n.dataEmissao) > new Date(Date.now() + 864e5)) add("dataEmissao", "A data de emissão está no futuro.", false);

    if (it.quantidade != null && it.valorUnitario != null && it.valorTotal != null && Math.abs(it.quantidade * it.valorUnitario - it.valorTotal) > 0.05)
      add("itens", `Item ${i + 1}: quantidade × valor unitário não dá o total do item.`, false);
  });
  const soma = (n.itens || []).reduce((s, it) => s + (Number(it.valorTotal) || 0), 0);
  if ((n.itens || []).length && n.valorTotal != null && Math.abs(soma - n.valorTotal) > 0.05)
    add("valorTotal", `A soma dos itens (${BRL.format(soma)}) é diferente do total da nota. Confira frete, descontos ou impostos.`, false);
  return av;
}

/* ---------- datas: séries da semana e textos relativos ("há 2 h") ---------- */
const mesmoDia = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
// conta, para cada um dos últimos 7 dias, quantas entregas têm o campo de data naquele dia
function serieSemana(E, campo) {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const dia = new Date(); dia.setDate(dia.getDate() - i);
    out.push(E.filter(e => e[campo] && mesmoDia(new Date(e[campo]), dia)).length);
  }

}
const RTF = new Intl.RelativeTimeFormat("pt-BR", { numeric: "auto" });
function tempoRelativo(iso) {
  const s = (new Date(iso) - Date.now()) / 1000, a = Math.abs(s);
  if (a < 60) return "agora";

  if (a < 86400) return RTF.format(Math.round(s / 3600), "hour");

}

const dataHora = iso => iso ? DTF.format(new Date(iso)).replace(",", " ·") : "";

/* Sparkline — traduzido do componente "Sparkline" (21st.dev / appica-dev):
   curva suavizada, preenchimento em gradiente e, no hover, guia + ponto + tooltip. */
function sparkPath(data, h, smoothing = 0.5) {
  const lo = Math.min(...data), hi = Math.max(...data), span = hi - lo || 1, inset = 4, plot = h - inset * 2;
  const pts = data.map((v, i) => ({ x: data.length === 1 ? 50 : (i / (data.length - 1)) * 100, y: inset + (1 - (v - lo) / span) * plot }));
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1.x + ((p2.x - p0.x) / 6) * smoothing, c1y = p1.y + ((p2.y - p0.y) / 6) * smoothing;
    const c2x = p2.x - ((p3.x - p1.x) / 6) * smoothing, c2y = p2.y - ((p3.y - p1.y) / 6) * smoothing;
    d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  return { d, fill: `${d} L 100 ${h} L 0 ${h} Z`, pts };
}
function sparkline(data, labels, unit) {
  const h = 56, g = sparkPath(data, h);
  return `
    <div class="spark" data-series="${data.join(",")}" data-labels="${labels.join(",")}" data-unit="${unit}" role="img"
         aria-label="Últimos 7 dias: ${data.join(", ")} ${unit}">
      <svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" style="stop-color:var(--primary);stop-opacity:.28"/>
          <stop offset="100%" style="stop-color:var(--primary);stop-opacity:0"/>
        </linearGradient></defs>
        <path d="${g.fill}" fill="url(#sg)"/>
        <path d="${g.d}" fill="none" style="stroke:var(--primary)" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="spark-guide"></span><span class="spark-dot"></span><div class="tip"></div>
    </div>`;
}
function bindSparks() {
  $$(".spark").forEach(el => {
    const data = el.dataset.series.split(",").map(Number), labels = el.dataset.labels.split(","), unit = el.dataset.unit;
    const g = sparkPath(data, 56), guide = el.querySelector(".spark-guide"), dot = el.querySelector(".spark-dot"), tip = el.querySelector(".tip");
    const show = ev => {
      const r = el.getBoundingClientRect(), t = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
      const i = Math.round(t * (data.length - 1)), p = g.pts[i];
      const px = (p.x / 100) * r.width, py = (p.y / 56) * r.height;
      guide.style.transform = `translateX(${px - .5}px)`;
      dot.style.transform = `translate(${px - 5.5}px, ${py - 5.5}px)`;
      tip.style.left = p.x + "%"; tip.style.top = (p.y / 56) * 100 + "%";
      tip.innerHTML = `<span>${esc(labels[i])}</span>${data[i]} ${esc(unit)}`;
      el.classList.add("active");
    };
    el.addEventListener("pointermove", show);
    el.addEventListener("pointerdown", show);
    el.addEventListener("pointerleave", () => el.classList.remove("active"));
  });
}

/* Gráfico de fluxo semanal: cadastradas x entregues em linhas com área suave.
   Linha (e não barra) porque o assunto é a tendência ao longo dos dias.
   Curva monotônica: suaviza sem "inventar" picos ou valores abaixo de zero. */
function curvaMonotona(p) {
  const n = p.length, m = [], t = [];
  for (let i = 0; i < n - 1; i++) m.push((p[i + 1].y - p[i].y) / (p[i + 1].x - p[i].x));
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], h = a * a + b * b;
    if (h > 9) { const k = 3 / Math.sqrt(h); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = `M ${p[0].x} ${p[0].y}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (p[i + 1].x - p[i].x) / 3;
    d += ` C ${(p[i].x + dx).toFixed(2)} ${(p[i].y + t[i] * dx).toFixed(2)}, ${(p[i + 1].x - dx).toFixed(2)} ${(p[i + 1].y - t[i + 1] * dx).toFixed(2)}, ${p[i + 1].x} ${p[i + 1].y.toFixed(2)}`;
  }
  return d;
}
/* posições em % (0-100) — usadas tanto pelo SVG quanto pelos pontos HTML */
function geometriaFluxo(a, b) {
  const topo = Math.max(4, Math.ceil(Math.max(...a, ...b) / 4) * 4), pad = 3;
  const x = i => pad + (i / (a.length - 1)) * (100 - pad * 2);
  const y = v => 100 - (v / topo) * 100;
  return { topo, pa: a.map((v, i) => ({ x: x(i), y: y(v) })), pb: b.map((v, i) => ({ x: x(i), y: y(v) })) };
}
function flowChart(a, b, labels) {
  const g = geometriaFluxo(a, b), ticks = [0, g.topo / 2, g.topo];
  const ta = a.reduce((s, v) => s + v, 0), tb = b.reduce((s, v) => s + v, 0);
  const area = pts => `${curvaMonotona(pts)} L ${pts[pts.length - 1].x} 100 L ${pts[0].x} 100 Z`;
  const ult = a.length - 1;
  return `
    <div class="flow-sum">
      <div><small>Cadastradas</small><b class="num">${ta}<span>na semana</span></b></div>
      <div><small>Entregues</small><b class="num">${tb}<span>na semana</span></b></div>
      <div><small>Taxa de entrega</small><b class="num">${ta ? Math.round((tb / ta) * 100) : 0}%</b></div>
    </div>
    <div class="flow ${S.animou ? "" : "grow"}" id="flow" tabindex="0" role="group"
         aria-label="Fluxo dos últimos 7 dias. Use as setas para ver cada dia.">
      <div class="flow-y" aria-hidden="true">${ticks.map(t => `<span style="bottom:${(t / g.topo) * 100}%">${t}</span>`).join("")}</div>
      <div class="flow-plot" aria-hidden="true">
        ${ticks.map(t => `<div class="flow-grid ${t ? "" : "base"}" style="bottom:${(t / g.topo) * 100}%"></div>`).join("")}
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:var(--ch-a);stop-opacity:.16"/><stop offset="100%" style="stop-color:var(--ch-a);stop-opacity:0"/></linearGradient>
            <linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:var(--ch-b);stop-opacity:.14"/><stop offset="100%" style="stop-color:var(--ch-b);stop-opacity:0"/></linearGradient>
          </defs>
          <path d="${area(g.pa)}" fill="url(#fa)"/>
          <path d="${area(g.pb)}" fill="url(#fb)"/>
          <path class="f-line a" d="${curvaMonotona(g.pa)}" vector-effect="non-scaling-stroke"/>
          <path class="f-line b" d="${curvaMonotona(g.pb)}" vector-effect="non-scaling-stroke"/>
        </svg>
        <span class="flow-guide"></span>
        <span class="fdot a end" style="left:${g.pa[ult].x}%;top:${g.pa[ult].y}%"></span>
        <span class="fdot b end" style="left:${g.pb[ult].x}%;top:${g.pb[ult].y}%"></span>
        <span class="fdot a hov"></span><span class="fdot b hov"></span>
        <div class="tip"></div>
      </div>
    </div>
    <div class="flow-x" aria-hidden="true">${labels.map((l, i) => `<span class="${i === ult ? "hoje" : ""}" style="left:${g.pa[i].x}%">${esc(l)}</span>`).join("")}</div>
    <div class="sr"><table><caption>Entregas por dia</caption><thead><tr><th>Dia</th><th>Cadastradas</th><th>Entregues</th></tr></thead>
      <tbody>${labels.map((l, i) => `<tr><td>${esc(l)}</td><td>${a[i]}</td><td>${b[i]}</td></tr>`).join("")}</tbody></table></div>`;
}
/* hover (mouse/toque) e teclado: guia vertical + pontos + tooltip com os dois valores do dia */
function bindFlow(a, b, labels) {
  const flow = $("#flow"); if (!flow) return;
  const plot = flow.querySelector(".flow-plot"), tip = plot.querySelector(".tip");
  const guide = plot.querySelector(".flow-guide"), [da, db] = plot.querySelectorAll(".fdot.hov");
  const g = geometriaFluxo(a, b);
  let atual = a.length - 1;
  const mostrar = i => {
    atual = i;
    const pa = g.pa[i], pb = g.pb[i];
    guide.style.left = pa.x + "%";
    da.style.left = pa.x + "%"; da.style.top = pa.y + "%";
    db.style.left = pb.x + "%"; db.style.top = pb.y + "%";
    tip.style.left = pa.x + "%"; tip.style.top = Math.min(pa.y, pb.y) + "%";
    tip.classList.toggle("ini", i === 0); tip.classList.toggle("fim", i === a.length - 1);
    tip.innerHTML = `<span class="day">${esc(labels[i])}</span>
      <span class="row"><i style="background:var(--ch-a)"></i>Cadastradas<em>${a[i]}</em></span>
      <span class="row"><i style="background:var(--ch-b)"></i>Entregues<em>${b[i]}</em></span>`;
    flow.classList.add("active");
  };
  const indice = ev => {
    const r = plot.getBoundingClientRect(), x = ((ev.clientX - r.left) / r.width) * 100;
    let melhor = 0;
    g.pa.forEach((p, i) => { if (Math.abs(p.x - x) < Math.abs(g.pa[melhor].x - x)) melhor = i; });
    return melhor;
  };
  plot.addEventListener("pointermove", ev => mostrar(indice(ev)));
  plot.addEventListener("pointerdown", ev => mostrar(indice(ev)));
  plot.addEventListener("pointerleave", () => flow.classList.remove("active"));
  flow.addEventListener("focus", () => mostrar(atual));
  flow.addEventListener("blur", () => flow.classList.remove("active"));
  flow.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight") { ev.preventDefault(); mostrar(Math.min(a.length - 1, atual + 1)); }
    if (ev.key === "ArrowLeft") { ev.preventDefault(); mostrar(Math.max(0, atual - 1)); }
  });
}

/* Donut de status com destaque no hover (arco + legenda sincronizados) */
function donut(counts) {
  const total = counts.reduce((s, c) => s + c.n, 0);
  const r = 70, C = 2 * Math.PI * r, gap = total > 1 ? 4 : 0;
  let off = 0;
  const arcs = counts.map(c => {
    const len = total ? (c.n / total) * C : 0;
    const seg = c.n ? `<circle class="seg-arc" data-k="${c.k}" cx="84" cy="84" r="${r}" style="stroke:${c.color}"
      stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}"/>` : "";
    off += len; return seg;
  }).join("");
  return `
    <div class="donut-wrap">
      <div class="donut" id="donut">
        <svg viewBox="0 0 168 168" aria-hidden="true"><circle cx="84" cy="84" r="${r}" style="stroke:var(--surface-3)"/>${arcs}</svg>
        <div class="donut-center"><b class="num" id="donutN">${total}</b><span id="donutL">${total === 1 ? "entrega" : "entregas"}</span></div>
      </div>
      <div class="dlegend">
        ${counts.map(c => `<button data-k="${c.k}" data-n="${c.n}" data-lbl="${c.label}" aria-label="${c.label}: ${c.n}">
          <i style="background:${c.color}"></i><span class="lbl">${c.label}</span><span class="val num">${c.n}</span></button>`).join("")}
      </div>
    </div>`;
}
function bindDonut(total) {
  const d = $("#donut"); if (!d) return;
  const n = $("#donutN"), l = $("#donutL");
  const on = k => {
    const btn = $(`.dlegend button[data-k="${k}"]`);
    d.classList.add("hovering");
    $$(".seg-arc").forEach(a => a.classList.toggle("hl", a.dataset.k === k));
    $$(".dlegend button").forEach(b => b.classList.toggle("hl", b.dataset.k === k));
    n.textContent = btn.dataset.n; l.textContent = btn.dataset.lbl.toLowerCase();
  };
  const off = () => {
    d.classList.remove("hovering"); $$(".dlegend button").forEach(b => b.classList.remove("hl"));
    n.textContent = total; l.textContent = total === 1 ? "entrega" : "entregas";
  };
  $$(".seg-arc").forEach(a => { a.addEventListener("pointerenter", () => on(a.dataset.k)); a.addEventListener("pointerleave", off); });
  $$(".dlegend button").forEach(b => {
    b.addEventListener("pointerenter", () => on(b.dataset.k)); b.addEventListener("pointerleave", off);
    b.addEventListener("focus", () => on(b.dataset.k)); b.addEventListener("blur", off);
    b.addEventListener("click", () => irPara("entregas", { fEnt: b.dataset.k }));
  });
}

      <div class="kpi-top"><div class="kpi-ico">${ico("truck")}</div><span class="kpi-label">Em trânsito</span><span class="kpi-go">${ico("arrow", "ic-sm")}</span></div>
      <div class="kpi-row"><div class="kpi-num num" data-count="${tran.length}">${tran.length}</div></div>
      <div class="kpi-vis">${minibars(desp, DIAS, "despachadas")}</div>
      <div class="kpi-foot"><b>${pend.length}</b> aguardando despacho</div>
    </button>
    <button class="card kpi glow spot lift clickable c-3" data-go="entregas" data-f="Entregue" aria-label="Ver entregas concluídas">
      ${glowRing}
      <div class="kpi-top"><div class="kpi-ico">${ico("ccheck")}</div><span class="kpi-label">Concluídas</span><span class="kpi-go">${ico("arrow", "ic-sm")}</span></div>
      <div class="kpi-row">
        <div class="kpi-num num"><span data-count="${pct}">${pct}</span><small>%</small></div>
        <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="track" cx="32" cy="32" r="26"/>
          <circle class="val" cx="32" cy="32" r="26" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"/></svg>
      </div>
      <div class="kpi-vis">
        <div class="sbar" role="img" aria-label="${pend.length} pendentes, ${tran.length} em trânsito, ${entr.length} entregues">
          <i style="flex-grow:${pend.length};background:var(--amber)"></i><i style="flex-grow:${tran.length};background:var(--indigo)"></i><i style="flex-grow:${entr.length};background:var(--green)"></i>
        </div>
        <div class="sbar-key"><span><i style="background:var(--amber)"></i>${pend.length}</span><span><i style="background:var(--indigo)"></i>${tran.length}</span><span><i style="background:var(--green)"></i>${entr.length}</span></div>
      </div>
      <div class="kpi-foot"><b>${entr.length}</b> de ${plural(E.length, "entrega", "entregas")} já entregues</div>
    </button>
    <button class="card kpi glow spot lift clickable c-3" data-go="motoristas" aria-label="Ver motoristas">
      ${glowRing}
      <div class="kpi-top"><div class="kpi-ico">${ico("card")}</div><span class="kpi-label">Em rota</span><span class="kpi-go">${ico("arrow", "ic-sm")}</span></div>
      <div class="kpi-row">
        <div class="kpi-num num"><span data-count="${emRota.length}">${emRota.length}</span><small>/${M.length}</small></div>
        <div class="stack">${emRota.map(m => avatar(m.nome, m.id, "av-sm")).join("")}</div>
      </div>
      <div class="kpi-vis"><div class="segbar" aria-hidden="true">${M.map((m, i) => `<i class="${i < emRota.length ? "on" : ""}"></i>`).join("")}</div></div>
      <div class="kpi-foot"><b>${M.length - emRota.length}</b> ${M.length - emRota.length === 1 ? "motorista disponível" : "motoristas disponíveis"}</div>
    </button>`;

  const counts = [
    { k: "Pendente", label: "Pendente", n: pend.length, color: "var(--amber)" },
    { k: "EmTransito", label: "Em trânsito", n: tran.length, color: "var(--indigo)" },
    { k: "Entregue", label: "Entregue", n: entr.length, color: "var(--green)" },
  ];

  // Atividade: cada entrega gera até 3 eventos (cadastro, despacho, entrega); mostra os 5 mais recentes
  const TIPO = {
    criada: { titulo: "Entrega cadastrada", cls: "pend", ic: "clock" },
    despachada: { titulo: "Saiu para entrega", cls: "tran", ic: "truck" },
    entregue: { titulo: "Entrega concluída", cls: "entr", ic: "check" },
  };
  const eventos = [];
  E.forEach(e => {
    eventos.push({ e, tipo: "criada", quando: e.criadaEm });
    if (e.despachadaEm) eventos.push({ e, tipo: "despachada", quando: e.despachadaEm });
    if (e.entregueEm) eventos.push({ e, tipo: "entregue", quando: e.entregueEm });
  });
  eventos.sort((x, y) => new Date(y.quando) - new Date(x.quando));
  const feed = eventos.slice(0, 5).map(({ e, tipo, quando }) => `
    <div class="feed-item">
      <div class="feed-ico ${TIPO[tipo].cls}">${ico(TIPO[tipo].ic)}</div>
      <div class="feed-txt">
        <b>${TIPO[tipo].titulo}</b>
        <span>${code(e.id)} para ${esc(e.cliente ? e.cliente.nome : "cliente removido")}${tipo !== "criada" && e.motorista ? " com " + esc(e.motorista.nome) : ""}</span>
      </div>
      <div class="feed-end">
        <time class="feed-time" datetime="${quando}" title="${dataHora(quando)}">${tempoRelativo(quando)}</time>
        ${tipo === "criada" && e.status === "Pendente" ? `<button class="btn btn-primary btn-sm feed-act" data-despachar="${e.id}">Despachar</button>` : ""}
      </div>
    </div>`).join("");

  const fila = pend.map(e => `
    <div class="ink-item">
      <div class="ink-pin">${ico("pin")}</div>
      <div class="t"><b>${codeHTML(e.id)}</b><span>${esc(e.endereco)}</span></div>
      <button class="btn btn-white btn-sm" data-despachar="${e.id}">Despachar</button>
    </div>`).join("");

  return `
    <div class="bento">
      ${DB.modo() === "demo" ? `<div class="c-12 demo off" id="demoBanner">${ico("info", "ic-sm")}Modo demonstração: a API não respondeu, então os dados são de exemplo e ficam só neste navegador.</div>` : ""}
      ${kpis}
      <section class="card fill c-8">
        <div class="card-head">
          <div><h2>Fluxo de entregas</h2><div class="sub">Últimos 7 dias</div></div>
          <div class="end legend"><span><i class="line" style="background:var(--ch-a)"></i>Cadastradas</span><span><i class="line" style="background:var(--ch-b)"></i>Entregues</span></div>
        </div>
        ${flowChart(cad, ent, DIAS)}
      </section>
      <section class="card c-4">
        <div class="card-head"><div><h2>Status agora</h2><div class="sub">Toque em um status para filtrar</div></div></div>
        ${donut(counts)}
      </section>
      <section class="card c-7">
        <div class="card-head"><div><h2>Atividade recente</h2><div class="sub">Movimentações das entregas</div></div>
          <div class="end"><button class="btn btn-soft btn-sm" data-go="entregas">Ver entregas</button></div></div>
        <div class="feed">${feed || `<div class="empty">${ico("pkg")}<div>Nenhuma entrega cadastrada ainda.</div></div>`}</div>
      </section>
      <section class="card ink spot fill c-5">
        ${pend.length ? '<span class="beam" aria-hidden="true"><i></i></span>' : ""}
        <div class="card-head"><div><h2>Fila de despacho</h2><div class="sub">${pend.length ? plural(pend.length, "entrega aguardando motorista", "entregas aguardando motorista") : "Nada esperando motorista"}</div></div></div>
        <div class="ink-list">${fila || `<div class="ink-empty">${ico("ccheck")}<div>Fila vazia. Todas as entregas já saíram.</div></div>`}</div>
        <div class="ink-free">
          <span class="muted">Equipe agora</span>
          <div class="crew">${M.length ? M.map(m => {
            const e = tran.find(x => x.motoristaId === m.id);
            return `<div class="crew-row">${avatar(m.nome, m.id, "av-sm")}<b>${esc(m.nome)}</b>${e ? `<span class="st">em rota · ${codeHTML(e.id)}</span>` : '<span class="st livre">disponível</span>'}</div>`;
          }).join("") : '<span class="muted">Nenhum motorista cadastrado.</span>'}</div>
        </div>
      </section>
    </div>`;
}

/* ---------- ENTREGAS (master-detail, ref. Finnova) ---------- */
function filtrarEntregas() {
  const q = S.busca.toLowerCase();
  return DB.listarEntregas()
    .filter(e => S.fEnt === "todas" || e.status === S.fEnt)
    .filter(e => !q || [code(e.id), e.endereco, e.cliente?.nome, e.motorista?.nome, ST[e.status].label].join(" ").toLowerCase().includes(q))
    .sort((x, y) => y.id - x.id);
}
function viewEntregas() {
  const todas = DB.listarEntregas();
  const n = k => k === "todas" ? todas.length : todas.filter(e => e.status === k).length;
  const lista = filtrarEntregas();
  if (!lista.some(e => e.id === S.sel)) S.sel = lista[0]?.id ?? null;
  const sel = lista.find(e => e.id === S.sel);

  const filtros = [["todas", "Todas"], ["Pendente", "Pendente"], ["EmTransito", "Em trânsito"], ["Entregue", "Entregue"]]
    .map(([k, l]) => `<button class="${S.fEnt === k ? "on" : ""}" data-fent="${k}" aria-pressed="${S.fEnt === k}">${l}<span class="n num">${n(k)}</span></button>`).join("");

  const itens = lista.map(e => `
    <button class="ink-item ${e.id === S.sel ? "sel" : ""}" data-sel="${e.id}" aria-current="${e.id === S.sel}">
      ${e.cliente ? avatar(e.cliente.nome, e.cliente.id) : `<div class="ink-pin">${ico("pin")}</div>`}
      <div class="t"><b>${codeHTML(e.id)}</b><span>${esc(e.cliente ? e.cliente.nome : "Sem cliente")}</span></div>
      ${chip(e.status)}
    </button>`).join("");

  return `
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Filtrar por status">${filtros}</div>
        <div class="end"><button class="btn btn-primary" id="novaEntrega">${ico("plus")}Nova entrega</button></div>
      </div>
      <div class="md ${S.sheet ? "sheet-open" : ""}">
        <div class="sheet-back" data-sheet-close="1" aria-hidden="true"></div>
        <section class="card ink spot">
          <div class="card-head"><div><h2>Entregas</h2><div class="sub">${plural(lista.length, "resultado", "resultados")}</div></div></div>
          <div class="ink-list">${itens || `<div class="ink-empty">${ico("search")}<div>Nenhuma entrega com esse filtro.</div></div>`}</div>
        </section>
        ${detalheEntrega(sel)}
      </div>
    </div>`;
}
function detalheEntrega(e) {
  if (!e) return `<section class="detail detail-empty" id="detail"><div>${ico("pkg")}<p style="margin-top:8px">Selecione uma entrega para ver os detalhes.</p></div></section>`;
  const ordem = ["Pendente", "EmTransito", "Entregue"], at = ordem.indexOf(e.status);
  const quando = { Pendente: e.criadaEm, EmTransito: e.despachadaEm, Entregue: e.entregueEm };
  const notasEnt = DB.listarNotas().filter(n => n.entregaId === e.id);
  const steps = ordem.map((s, i) => `
    ${i ? `<div class="step-line ${i <= at ? "done" : ""}"></div>` : ""}
    <div class="step ${i < at || (i === at && s === "Entregue") ? "done" : i === at ? "now" : ""}">
      <i>${i < at || (i === at && s === "Entregue") ? ico("check", "ic-sm") : i + 1}</i>
      <span class="step-txt">${ST[s].label}${quando[s] ? `<small><time datetime="${quando[s]}">${dataHora(quando[s])}</time></small>` : ""}</span>
    </div>`).join("");

  let acao = "";
  if (e.status === "Pendente") {
    const M = DB.listarMotoristas();
    acao = M.length
      ? `<span class="note">${ico("truck", "ic-sm")}Escolha quem vai levar</span>
         <label class="sr" for="dMot">Motorista</label>
         <select class="d-select" id="dMot"><option value="">Selecione o motorista</option>${M.map(m => `<option value="${m.id}">${esc(m.nome)}</option>`).join("")}</select>
         <button class="btn btn-white" data-act="despachar">${ico("send", "ic-sm")}Despachar</button>
         <div class="err" id="dErr" hidden></div>`
      : `<span class="note">${ico("alert", "ic-sm")}Cadastre um motorista para despachar</span>
         <button class="btn btn-white" data-go="motoristas">Ir para motoristas</button>`;
  } else if (e.status === "EmTransito") {
    acao = `<span class="note">${ico("truck", "ic-sm")}A caminho com ${esc(e.motorista?.nome || "motorista")}</span>
            <button class="btn btn-white" data-act="entregue">${ico("check", "ic-sm")}Confirmar entrega</button>`;
  } else {
    acao = `<span class="note">${ico("ccheck", "ic-sm")}Entrega concluída</span>`;
  }

  return `
    <section class="detail" id="detail" aria-live="polite" aria-label="Detalhes da entrega ${code(e.id)}">
      <span class="sheet-grip" aria-hidden="true"></span>
      <div class="d-top">
        <div><div class="d-id num" translate="no">${code(e.id)}</div><div class="d-sub">Entrega para ${esc(e.cliente?.nome || "cliente removido")}</div></div>
        ${chip(e.status)}
        <button class="sheet-close" data-sheet-close="1" aria-label="Fechar detalhes">${ico("x", "ic-sm")}</button>
      </div>
      <div class="d-tiles">
        <div class="d-tile"><small>Cliente</small><b>${esc(e.cliente?.nome || "—")}</b></div>
        <div class="d-tile"><small>Motorista</small><b>${esc(e.motorista?.nome || "Ainda não definido")}</b></div>
        <div class="d-tile"><small>Endereço</small><b>${esc(e.endereco)}</b></div>
      </div>
      <div class="steps" aria-label="Andamento da entrega">${steps}</div>
      <div class="d-notas">
        <span class="d-notas-t">${ico("receipt", "ic-sm")}Notas fiscais</span>
        ${notasEnt.length ? notasEnt.map(n => `<button class="d-nota" data-ver-nota="${n.id}">NF ${esc(n.numero)} · ${BRL.format(n.valorTotal)}</button>`).join("") : '<span class="d-notas-v">Nenhuma nota vinculada</span>'}
        <button class="btn btn-white btn-sm" data-anexar-nota="${e.id}">${ico("upload", "ic-sm")}Anexar nota</button>
      </div>
      <div class="d-foot">
        ${acao}
        <button class="d-del" data-act="excluir" aria-label="Excluir entrega ${code(e.id)}">${ico("trash", "ic-sm")}</button>
      </div>
    </section>`;
}

/* ---------- CLIENTES ---------- */
function viewClientes() {
  const E = DB.listarEntregas(), todos = DB.listarClientes(), q = S.busca.toLowerCase();
  const n = k => k === "todos" ? todos.length : todos.filter(c => (k === "ativos") === c.ativo).length;
  const lista = todos
    .filter(c => S.fCli === "todos" || (S.fCli === "ativos") === c.ativo)
    .filter(c => !q || c.nome.toLowerCase().includes(q));
  const filtros = [["todos", "Todos"], ["ativos", "Ativos"], ["inativos", "Inativos"]]
    .map(([k, l]) => `<button class="${S.fCli === k ? "on" : ""}" data-fcli="${k}" aria-pressed="${S.fCli === k}">${l}<span class="n num">${n(k)}</span></button>`).join("");

  const linhas = lista.map(c => {
    const qtd = E.filter(e => e.clienteId === c.id).length;
    return `<tr>
      <td><div class="who">${avatar(c.nome, c.id)}<div><b>${esc(c.nome)}</b><span>Cliente #${c.id}</span></div></div></td>
      <td class="num">${c.idade} anos</td>
      <td class="num">${plural(qtd, "entrega", "entregas")}</td>
      <td>${c.ativo ? '<span class="chip on">Ativo</span>' : '<span class="chip off">Inativo</span>'}</td>
      <td><div class="row-acts">
        <button class="icon-act" data-edit-cli="${c.id}" aria-label="Editar ${esc(c.nome)}">${ico("edit", "ic-sm")}</button>
        <button class="icon-act del" data-del-cli="${c.id}" aria-label="Excluir ${esc(c.nome)}">${ico("trash", "ic-sm")}</button>
      </div></td>
    </tr>`;
  }).join("");

  /* no celular a tabela vira cartões: cinco colunas não cabem em 390px */
  const cartoes = lista.map(c => {
    const qtd = E.filter(e => e.clienteId === c.id).length;
    return `<div class="ccard">${avatar(c.nome, c.id)}
      <div class="t"><b>${esc(c.nome)}</b>
        <div class="meta">${c.ativo ? '<span class="chip on">Ativo</span>' : '<span class="chip off">Inativo</span>'}<span>${c.idade} anos · ${plural(qtd, "entrega", "entregas")}</span></div></div>
      <div class="acts">
        <button class="icon-act" data-edit-cli="${c.id}" aria-label="Editar ${esc(c.nome)}">${ico("edit", "ic-sm")}</button>
        <button class="icon-act del" data-del-cli="${c.id}" aria-label="Excluir ${esc(c.nome)}">${ico("trash", "ic-sm")}</button>
      </div></div>`;
  }).join("");

  return `
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Filtrar clientes">${filtros}</div>
        <div class="end"><button class="btn btn-primary" id="novoCliente">${ico("plus")}Novo cliente</button></div>
      </div>
      <div class="mini-stats">
        <div class="card mstat"><div class="kpi-ico">${ico("users")}</div><div><small>Ativos</small><b class="num">${todos.filter(c => c.ativo).length}<span>/${todos.length}</span></b></div></div>
        <div class="card mstat"><div class="kpi-ico">${ico("truck")}</div><div><small>Em andamento</small><b class="num">${new Set(E.filter(e => e.status !== "Entregue").map(e => e.clienteId)).size}</b></div></div>
        <div class="card mstat"><div class="kpi-ico">${ico("pkg")}</div><div><small>Sem entregas</small><b class="num">${todos.filter(c => !E.some(e => e.clienteId === c.id)).length}</b></div></div>
      </div>
      <section class="card list-card">
        <div class="ccards">${cartoes || `<div class="empty">${ico("users")}<div>Nenhum cliente encontrado.</div></div>`}</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th scope="col">Cliente</th><th scope="col">Idade</th><th scope="col">Entregas</th><th scope="col">Situação</th><th scope="col"><span class="sr">Ações</span></th></tr></thead>
            <tbody>${linhas || `<tr><td colspan="5"><div class="empty">${ico("users")}<div>Nenhum cliente encontrado.</div></div></td></tr>`}</tbody>
          </table>
        </div>
      </section>
    </div>`;
}

/* ---------- MOTORISTAS (cards com spotlight) ---------- */
function viewMotoristas() {
  const E = DB.listarEntregas(), q = S.busca.toLowerCase();
  const M = DB.listarMotoristas();
  const lista = M.filter(m => !q || [m.nome, m.cnh, m.telefone].join(" ").toLowerCase().includes(q));
  const cards = lista.map(m => {
    const minhas = E.filter(e => e.motoristaId === m.id);
    const rota = minhas.some(e => e.status === "EmTransito");
    return `<article class="card dcard glow spot lift">${glowRing}
      <div class="dcard-top">
        ${avatar(m.nome, m.id, "av-lg")}
        <div class="t"><b>${esc(m.nome)}</b>${rota ? '<span class="chip tran">Em rota</span>' : '<span class="chip on">Disponível</span>'}</div>
      </div>
      <div class="dcard-meta">
        <span>${ico("card")}CNH <span class="num" translate="no">${esc(m.cnh)}</span></span>
        <span>${ico("phone")}${esc(m.telefone || "Sem telefone")}</span>
      </div>
      <div class="dstats">
        <div class="dstat"><small>Em trânsito</small><b class="num">${minhas.filter(e => e.status === "EmTransito").length}</b></div>
        <div class="dstat"><small>Entregues</small><b class="num">${minhas.filter(e => e.status === "Entregue").length}</b></div>
      </div>
      <div class="dcard-acts">
        <button class="icon-act" data-edit-mot="${m.id}" aria-label="Editar ${esc(m.nome)}">${ico("edit", "ic-sm")}</button>
        <button class="icon-act del" data-del-mot="${m.id}" aria-label="Excluir ${esc(m.nome)}">${ico("trash", "ic-sm")}</button>
      </div>
    </article>`;
  }).join("");
  const emRota = M.filter(m => E.some(e => e.motoristaId === m.id && e.status === "EmTransito")).length;
  return `
    <div class="mini-stats" style="margin-bottom:18px">
      <div class="card mstat"><div class="kpi-ico">${ico("truck")}</div><div><small>Em rota agora</small><b class="num">${emRota}<span>/${M.length}</span></b></div></div>
      <div class="card mstat"><div class="kpi-ico">${ico("ccheck")}</div><div><small>Disponíveis para despacho</small><b class="num">${M.length - emRota}</b></div></div>
      <div class="card mstat"><div class="kpi-ico">${ico("pkg")}</div><div><small>Entregas concluídas</small><b class="num">${E.filter(e => e.status === "Entregue").length}</b></div></div>
    </div>
    <div class="dgrid">
      ${cards}
      <button class="add-tile" id="novoMotorista"><div><div class="plus">${ico("plus")}</div><div style="margin-top:10px">Cadastrar motorista</div></div></button>
    </div>
    ${!lista.length && S.busca ? `<div class="empty">${ico("search")}<div>Nenhum motorista encontrado para "${esc(S.busca)}".</div></div>` : ""}`;
}

/* =====================================================================
   ROTEADOR E RENDER
   ===================================================================== */
const VIEWS = {
  dashboard: { fn: viewDashboard, title: () => `${saudacao()}, Gustavo`, sub: () => new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }) },
  entregas: { fn: viewEntregas, title: () => "Entregas", sub: () => "Acompanhe, despache e conclua as entregas" },
  clientes: { fn: viewClientes, title: () => "Clientes", sub: () => "Quem solicita as entregas" },
  motoristas: { fn: viewMotoristas, title: () => "Motoristas", sub: () => "Quem leva as entregas até o destino" },
  notas: { fn: viewNotas, title: () => "Notas fiscais", sub: () => "Lidas por IA, conferidas por você" },
};

function render() {
  const v = VIEWS[S.view];
  $("#content").innerHTML = v.fn();
  $("#pageTitle").textContent = v.title();
  const sub = v.sub(); $("#pageSub").textContent = sub.charAt(0).toUpperCase() + sub.slice(1);
  $$(".nav-item, .tabbar a").forEach(b => {
    const on = b.dataset.view === S.view;
    b.classList.toggle("active", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const pend = DB.listarEntregas().filter(e => e.status === "Pendente").length;

  $("#badgeTab").textContent = pend; $("#badgeTab").hidden = !pend;

  if (d.novaNota) return abrirNovaNota({ exemplo: d.novaNota === "exemplo" });

  if (d.delNota) {
    const n = DB.listarNotas().find(x => x.id === Number(d.delNota));
    return confirmar(`Excluir a nota ${n.numero}?`, "A nota e o arquivo anexado serão removidos.", "Excluir nota", async () => {
      const r = await DB.excluirNota(n.id); r.erro ? toast(r.erro, true) : toast(`Nota ${n.numero} excluída.`); render();
    });
  }
  if (t.id === "novoCliente") return formCliente();
  if (t.id === "novoMotorista") return formMotorista();
  if (d.editCli) return formCliente(Number(d.editCli));
  if (d.editMot) return formMotorista(Number(d.editMot));
  if (d.delCli) {
    const c = DB.acharCliente(Number(d.delCli));
    return confirmar(`Excluir ${c.nome}?`, "O cadastro do cliente será removido.", "Excluir cliente", async () => {
      const r = await DB.excluirCliente(c.id); r.erro ? toast(r.erro, true) : toast(`${c.nome} excluído.`); render();
    });
  }
  if (d.delMot) {
    const m = DB.acharMotorista(Number(d.delMot));
    return confirmar(`Excluir ${m.nome}?`, "O cadastro do motorista será removido.", "Excluir motorista", async () => {
      const r = await DB.excluirMotorista(m.id); r.erro ? toast(r.erro, true) : toast(`${m.nome} excluído.`); render();
    });

/* spotlight: o brilho do card segue o cursor */
document.addEventListener("pointermove", ev => {
  const el = ev.target.closest && ev.target.closest(".spot"); if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--mx", ev.clientX - r.left + "px");
  el.style.setProperty("--my", ev.clientY - r.top + "px");
}, { passive: true });

/* ---------- Glowing Effect (porte do componente da Aceternity no 21st.dev) ----------
   Mesma lógica do original: só acende quando o cursor está perto do card
   (proximidade) e fora do miolo dele (zona inativa); o ângulo do arco
   persegue o do cursor com suavização. O original usa a lib "motion" para
   animar o ângulo; aqui um requestAnimationFrame faz esse papel. */
const GLOW = { proximidade: 64, zonaInativa: 0.45, suavizacao: 0.16 };
const glowAngulo = new WeakMap();
let gx = -1e5, gy = -1e5, gRaf = 0;
function glowFrame() {
  gRaf = 0;
  let continuar = false;
  $$(".glow").forEach(el => {
    const ring = el.querySelector(":scope > .glow-ring"); if (!ring) return;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, p = GLOW.proximidade;
    const perto = gx > r.left - p && gx < r.right + p && gy > r.top - p && gy < r.bottom + p;
    const noMiolo = Math.hypot(gx - cx, gy - cy) < 0.5 * Math.min(r.width, r.height) * GLOW.zonaInativa;
    ring.style.setProperty("--active", perto && !noMiolo ? "1" : "0");
    if (!perto) return;
    const alvo = (Math.atan2(gy - cy, gx - cx) * 180) / Math.PI + 90;
    const atual = glowAngulo.get(el) ?? alvo;
    const diff = ((alvo - atual + 540) % 360) - 180;          // caminho mais curto no círculo
    const novo = atual + diff * GLOW.suavizacao;
    glowAngulo.set(el, novo);
    ring.style.setProperty("--start", novo.toFixed(2));
    if (Math.abs(diff) > 0.4) continuar = true;
  });
  if (continuar) gRaf = requestAnimationFrame(glowFrame);
}
const pedirGlow = () => { if (!gRaf) gRaf = requestAnimationFrame(glowFrame); };
document.addEventListener("pointermove", ev => {
  if (ev.pointerType !== "mouse") return;                     // no toque não há "cursor perto"
  gx = ev.clientX; gy = ev.clientY; pedirGlow();
}, { passive: true });
document.addEventListener("pointerleave", () => { gx = gy = -1e5; pedirGlow(); });
window.addEventListener("scroll", pedirGlow, { passive: true });

/* ---------- abas com indicador deslizante ----------
   Como cada clique redesenha a tela, o indicador nasce na posição da aba
   anterior (guardada aqui) e no quadro seguinte desliza até a nova. */
const abaAnterior = {};
function posicionarAbas() {
  $$(".toolbar .seg").forEach(seg => {
    const on = seg.querySelector("button.on"); if (!on) return;
    const chave = seg.getAttribute("aria-label");
    const ind = document.createElement("span");
    ind.className = "seg-ind"; ind.setAttribute("aria-hidden", "true");
    const de = abaAnterior[chave], para = { x: on.offsetLeft, w: on.offsetWidth };
    const aplicar = pos => { ind.style.width = pos.w + "px"; ind.style.transform = `translateX(${pos.x}px)`; };
    ind.style.transition = "none"; aplicar(de || para);
    seg.prepend(ind); seg.classList.add("ready");
    void ind.offsetWidth;                                       // força o navegador a fixar a posição inicial
    ind.style.transition = ""; aplicar(para);
    abaAnterior[chave] = para;
    if (on.scrollIntoView && seg.scrollWidth > seg.clientWidth) on.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
}
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(posicionarAbas, 120); });

const fmtDoc = d => {
  d = normalizarDoc(d);
  if (d.length === 14) return `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8, 12)}-${d.slice(12)}`;
  if (d.length === 11) return `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}`;
  return d;
};
const dataBR = iso => iso ? iso.slice(0, 10).split("-").reverse().join("/") : "—";
// número digitado no padrão brasileiro ("1.120,60") ou com ponto ("1120.6")
const lerNum = t => { t = String(t ?? "").trim(); if (!t) return null; if (t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); const n = Number(t); return Number.isFinite(n) ? n : null; };
const fmtNum = (v, casas = 2) => v == null ? "" : Number(v).toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas });
const fmtQtd = v => v == null ? "" : Number(v).toLocaleString("pt-BR", { maximumFractionDigits: 3 });

/* ---------- fluxo: nova nota (enviar → ler → revisar → salvar) ---------- */
const NF = { etapa: "enviar", arquivo: null, url: null, entregaId: null, dados: null, ia: new Set(), incertos: new Set(), editados: new Set(), lidaPorIa: false, leitura: 0 };
const CAMPOS_NF = ["chaveAcesso", "numero", "serie", "dataEmissao", "emitenteCnpj", "emitenteNome", "destinatarioDocumento", "destinatarioNome", "valorTotal", "itens"];

function abrirNovaNota({ entregaId = null, exemplo = false } = {}) {
  const E = DB.listarEntregas();
  if (!E.length) return toast("Cadastre uma entrega antes de lançar notas fiscais.", true);
  Object.assign(NF, { etapa: "enviar", arquivo: null, dados: null, ia: new Set(), incertos: new Set(), editados: new Set(), lidaPorIa: false, erro: null });
  if (NF.url) URL.revokeObjectURL(NF.url);
  NF.url = null;
  NF.entregaId = entregaId || E[0].id;
  abrirModal("Nova nota fiscal", `<div id="nfCorpo"></div>`, `<div class="nf-rodape" id="nfRodape"></div>`);
  $(".modal").classList.add("wide");
  desenharNF();
  if (exemplo) usarNotaExemplo();
}

function desenharNF() {
  const corpo = $("#nfCorpo"), rodape = $("#nfRodape");
  if (!corpo) return;
  if (NF.etapa === "enviar") {
    const opcoes = DB.listarEntregas().map(e => `<option value="${e.id}" ${e.id === NF.entregaId ? "selected" : ""}>${code(e.id)} · ${esc(e.cliente?.nome || "sem cliente")} · ${ST[e.status].label}</option>`).join("");
    corpo.innerHTML = `
      <div class="field"><label for="nfEnt">Entrega desta nota</label><select id="nfEnt">${opcoes}</select>
        <span class="hint">A nota fica vinculada a esta entrega.</span></div>
      <label class="drop" id="nfDrop">
        <input type="file" id="nfArq" accept="image/jpeg,image/png,image/webp,application/pdf" class="sr">
        <span class="drop-ico">${ico("upload")}</span>
        <b>Arraste a foto ou o PDF da nota aqui</b>
        <span>ou clique para escolher · JPG, PNG, WEBP ou PDF, até 5 MB</span>
        <span class="err" id="nfArqErr" role="alert"></span>
      </label>
      <div class="nf-ou"><span>ou</span></div>
      <button type="button" class="btn btn-soft nf-exemplo" id="nfExemplo">${ico("sparkle", "ic-sm")}Testar com a nota de exemplo</button>
      <p class="nf-priv">${ico("info", "ic-sm")}<span>Demonstração pública: use a nota de exemplo ou notas sem dados pessoais (CPF, endereço de pessoa física).</span></p>`;
    rodape.innerHTML = `<button type="button" class="btn btn-ghost" id="nfCancelar">Cancelar</button><button type="button" class="btn btn-soft" id="nfManual">Preencher sem IA</button>`;
    $("#nfEnt").addEventListener("change", e => { NF.entregaId = Number(e.target.value); });
    const drop = $("#nfDrop"), inp = $("#nfArq");
    inp.addEventListener("change", () => inp.files[0] && escolherArquivo(inp.files[0]));
    ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => e.dataTransfer.files[0] && escolherArquivo(e.dataTransfer.files[0]));
    $("#nfExemplo").addEventListener("click", usarNotaExemplo);
    $("#nfManual").addEventListener("click", () => irParaRevisao(null));
  }
  if (NF.etapa === "lendo") {
    corpo.innerHTML = `
      <div class="nf">
        ${previewNF()}
        <div class="nf-lendo" aria-live="polite">
          <div class="nf-pulse">${ico("sparkle")}</div>
          <b>A IA está lendo a nota…</b>
          <span>Costuma levar de 3 a 15 segundos.</span>
          <ol class="nf-etapas">
            <li class="ok">${ico("check", "ic-xs")}Arquivo enviado</li>
            <li class="ativo"><i></i>Lendo os campos com o Gemini</li>
            <li><i></i>Conferindo CNPJ, chave de acesso e totais</li>
          </ol>
          <div class="nf-skel"><i></i><i></i><i class="curto"></i><i></i><i class="curto"></i></div>
        </div>
      </div>`;
    rodape.innerHTML = `<button type="button" class="btn btn-ghost" id="nfCancelar">Cancelar</button>`;
  }
  if (NF.etapa === "falhou") {
    corpo.innerHTML = `
      <div class="nf">
        ${previewNF()}
        <div class="nf-lendo">
          <div class="nf-pulse erro">${ico("alert")}</div>
          <b>Não deu para ler esta nota</b>
          <span>${esc(NF.erro)}</span>
          <div class="nf-vazio-acts">
            ${NF.podeRepetir ? `<button type="button" class="btn btn-primary" id="nfRepetir">Tentar de novo</button>` : ""}
            <button type="button" class="btn btn-soft" id="nfManual">Preencher manualmente</button>
            <button type="button" class="btn btn-ghost" id="nfOutro">Escolher outro arquivo</button>
          </div>
        </div>
      </div>`;
    rodape.innerHTML = `<button type="button" class="btn btn-ghost" id="nfCancelar">Cancelar</button>`;
    $("#nfRepetir")?.addEventListener("click", () => lerArquivoNF());
    $("#nfManual").addEventListener("click", () => irParaRevisao(null));
    $("#nfOutro").addEventListener("click", () => { NF.etapa = "enviar"; desenharNF(); });
  }
  if (NF.etapa === "revisar") desenharRevisao();
  $("#nfCancelar")?.addEventListener("click", fecharNF);
}

function previewNF() {
  if (!NF.arquivo) return `<div class="nf-prev vazio">${ico("file")}<span>Sem arquivo: preenchimento manual</span></div>`;
  const pdf = NF.arquivo.type === "application/pdf";
  return `
    <details class="nf-prev-wrap" open>
      <summary>Ver arquivo da nota</summary>
      <div class="nf-prev">
        ${NF.url ? (pdf ? `<object data="${NF.url}" type="application/pdf" aria-label="PDF da nota"><a href="${NF.url}" target="_blank" rel="noopener">Abrir o PDF</a></object>`
                        : `<img src="${NF.url}" alt="Imagem da nota fiscal enviada">`) : `<div class="nf-prev vazio">${ico("file")}<span>${esc(NF.arquivo.name)}</span></div>`}
      </div>
      ${NF.url ? `<a class="nf-abrir" href="${NF.url}" target="_blank" rel="noopener">${ico("arrow", "ic-xs")}Abrir em tamanho real</a>` : ""}
    </details>`;
}

function fecharNF() {
  NF.leitura++;                                    // invalida uma leitura em andamento
  if (NF.url) URL.revokeObjectURL(NF.url);
  NF.url = null;
  fecharModal();
}

async function usarNotaExemplo() {
  let arquivo;
  try {
    const r = await fetch(NOTA_EXEMPLO.caminho);
    if (!r.ok) throw new Error();
    arquivo = new File([await r.blob()], NOTA_EXEMPLO.arquivo, { type: "image/jpeg" });
  } catch {
    arquivo = new File([new Uint8Array([0xFF, 0xD8, 0xFF])], NOTA_EXEMPLO.arquivo, { type: "image/jpeg" });
  }
  escolherArquivo(arquivo);
}

function escolherArquivo(arquivo) {
  const tipos = ["image/jpeg", "image/png", "image/webp", "application/pdf"];
  const err = $("#nfArqErr");
  if (!tipos.includes(arquivo.type)) { if (err) err.textContent = "Formato não aceito. Envie JPG, PNG, WEBP ou PDF."; return; }
  if (arquivo.size > 5 * 1024 * 1024) { if (err) err.textContent = "O arquivo passa de 5 MB. Tente uma foto menor."; return; }
  NF.arquivo = arquivo;
  if (NF.url) URL.revokeObjectURL(NF.url);
  NF.url = arquivo.size > 3 ? URL.createObjectURL(arquivo) : null;
  lerArquivoNF();
}

async function lerArquivoNF() {
  NF.etapa = "lendo"; desenharNF();
  const minha = ++NF.leitura;
  const r = await DB.lerNota(NF.arquivo);
  if (minha !== NF.leitura || !$("#nfCorpo")) return;       // o usuário cancelou ou fechou
  if (r.ok) return irParaRevisao(r.dado);
  NF.erro = r.erro;
  NF.podeRepetir = [0, 502, 504].includes(r.status);         // falha temporária; limite, cota ou "não é nota" não adianta repetir
  NF.etapa = "falhou"; desenharNF();
}

// Monta os dados de revisão a partir da leitura da IA (ou vazios, no preenchimento manual)
function irParaRevisao(leitura) {
  const d = leitura?.dados || {};
  NF.dados = {
    chaveAcesso: d.chaveAcesso || "", numero: d.numero || "", serie: d.serie || "", dataEmissao: d.dataEmissao || "",
    emitenteCnpj: d.emitenteCnpj || "", emitenteNome: d.emitenteNome || "",
    destinatarioDocumento: d.destinatarioDocumento || "", destinatarioNome: d.destinatarioNome || "",
    valorTotal: d.valorTotal ?? null,
    itens: (d.itens || []).map(i => ({ descricao: i.descricao || "", quantidade: i.quantidade ?? null, valorUnitario: i.valorUnitario ?? null, valorTotal: i.valorTotal ?? null })),
  };
  if (!NF.dados.itens.length) NF.dados.itens.push({ descricao: "", quantidade: null, valorUnitario: null, valorTotal: null });
  NF.lidaPorIa = !!leitura;
  NF.ia = new Set(leitura ? CAMPOS_NF.filter(c => c === "itens" ? (d.itens || []).length : d[c] != null && d[c] !== "") : []);
  NF.incertos = new Set(d.camposIncertos || []);
  NF.editados = new Set();
  NF.etapa = "revisar";
  desenharNF();
}

function campoNF(campo, rotulo, attrs = "", larg = "") {
  const v = NF.dados[campo];
  const valor = campo === "valorTotal" ? fmtNum(v) : /Cnpj|Documento/.test(campo) ? fmtDoc(v) : (v ?? "");
  const daIa = NF.ia.has(campo) && !NF.editados.has(campo), incerto = daIa && NF.incertos.has(campo);
  return `
    <div class="field ${incerto ? "incerto" : ""} ${larg}" data-campo="${campo}">
      <label for="nf_${campo}">${rotulo}${daIa ? `<span class="ia-tag" title="Preenchido pela IA">${ico("sparkle", "ic-xs")}IA</span>` : NF.editados.has(campo) && NF.ia.has(campo) ? '<span class="ia-tag ed">editado</span>' : ""}</label>
      <input id="nf_${campo}" name="${campo}" value="${esc(valor)}" autocomplete="off" spellcheck="false" ${attrs}>
      ${incerto ? '<span class="hint warn">A IA leu este campo com dúvida. Confira na imagem.</span>' : ""}
      <span class="err" role="alert"></span>
    </div>`;
}

function itensNF() {
  return NF.dados.itens.map((it, i) => `
    <div class="nf-item" data-i="${i}">
      <input aria-label="Descrição do item ${i + 1}" data-item="descricao" value="${esc(it.descricao)}" placeholder="Descrição do produto…" autocomplete="off">
      <input aria-label="Quantidade do item ${i + 1}" data-item="quantidade" inputmode="decimal" value="${fmtQtd(it.quantidade)}" placeholder="Qtd" class="num">
      <input aria-label="Valor unitário do item ${i + 1}" data-item="valorUnitario" inputmode="decimal" value="${fmtNum(it.valorUnitario)}" placeholder="Unit." class="num">
      <input aria-label="Total do item ${i + 1}" data-item="valorTotal" inputmode="decimal" value="${fmtNum(it.valorTotal)}" placeholder="Total" class="num">
      <button type="button" class="icon-act del" data-rem-item="${i}" aria-label="Remover item ${i + 1}">${ico("x", "ic-sm")}</button>
    </div>`).join("");
}

        <div id="nfConf"></div>

            ${campoNF("emitenteCnpj", "CNPJ", 'placeholder="00.000.000/0000-00…" class="num"')}

          <div class="g2">

            ${campoNF("destinatarioNome", "Nome", 'placeholder="Quem recebe…"')}

// Roda a conferência e mostra o resultado: no quadro de avisos e no campo de cada aviso
function atualizarConferencia() {
  const itensValidos = NF.dados.itens.filter(i => i.descricao.trim() || i.valorTotal != null);
  const avisos = conferirNota({ ...NF.dados, itens: itensValidos });
  $$(".nf-form .field[data-campo]").forEach(b => { b.classList.remove("bad", "aviso"); const e = b.querySelector(".err"); if (e) e.textContent = ""; });
  avisos.forEach(a => {
    const box = $(`.nf-form .field[data-campo="${a.campo}"]`); if (!box) return;
    box.classList.add(a.bloqueia ? "bad" : "aviso");
    const e = box.querySelector(".err"); if (e && (a.bloqueia || !e.textContent)) e.textContent = a.mensagem;
  });
  $$(".nf-form .field.bad.aviso").forEach(b => b.classList.remove("aviso"));      // vermelho vence o amarelo
  const soma = itensValidos.reduce((s, i) => s + (i.valorTotal || 0), 0);
  $("#nfSoma").innerHTML = `Soma dos itens: <b>${BRL.format(soma)}</b>`;
  const bloq = avisos.filter(a => a.bloqueia), alerta = avisos.filter(a => !a.bloqueia);
  $("#nfConf").innerHTML = !avisos.length
    ? `<div class="nf-conf ok">${ico("ccheck", "ic-sm")}<span><b>Conferência ok.</b> CNPJ, chave de acesso e totais conferem.</span></div>`
    : `<div class="nf-conf ${bloq.length ? "bloq" : "alerta"}">${ico("alert", "ic-sm")}<div><b>${bloq.length ? `${plural(bloq.length, "ponto precisa", "pontos precisam")} de correção antes de salvar` : "Confira antes de salvar"}</b>
        <ul>${[...bloq, ...alerta].map(a => `<li class="${a.bloqueia ? "b" : ""}">${esc(a.mensagem)}</li>`).join("")}</ul></div></div>`;
  return avisos;
}

async function salvarNF(ev) {
  ev.preventDefault();
  const avisos = atualizarConferencia();
  const itens = NF.dados.itens.filter(i => i.descricao.trim() || i.valorTotal != null);
  const faltando = [];
  if (!String(NF.dados.numero).trim()) faltando.push(["numero", "Informe o número da nota."]);
  if (!String(NF.dados.emitenteNome).trim()) faltando.push(["emitenteNome", "Informe o nome do emitente."]);
  if (!(NF.dados.valorTotal > 0)) faltando.push(["valorTotal", "Informe o valor total da nota."]);
  faltando.forEach(([c, m]) => { const b = $(`.nf-form .field[data-campo="${c}"]`); b.classList.add("bad"); b.querySelector(".err").textContent = m; });
  const itemRuim = itens.findIndex(i => !i.descricao.trim() || !(i.quantidade > 0));
  $("#nfItensErr").textContent = itemRuim >= 0 ? `Confira o item ${itemRuim + 1}: descrição e quantidade são obrigatórias.` : "";
  if (faltando.length || itemRuim >= 0 || avisos.some(a => a.bloqueia)) {
    $(".nf-form .field.bad input")?.focus();
    return toast("Corrija os campos destacados antes de salvar.", true);
  }
  const dados = {
    ...NF.dados, entregaId: NF.entregaId, dataEmissao: NF.dados.dataEmissao || null,
    itens: itens.map(i => ({ ...i, quantidade: i.quantidade || 0, valorUnitario: i.valorUnitario || 0, valorTotal: i.valorTotal || 0 })),
    lidaPorIa: NF.lidaPorIa,
  };
  const r = await ocupado($("#nfSalvar"), () => DB.salvarNota(dados, NF.arquivo && NF.arquivo.size > 3 ? NF.arquivo : null));
  if (r.erro) {
    if (r.campos) for (const [c, m] of Object.entries(r.campos)) {
      const b = $(`.nf-form .field[data-campo="${c}"]`); if (b) { b.classList.add("bad"); b.querySelector(".err").textContent = m; }
    }
    return toast(r.erro, true);
  }
  toast(`Nota ${r.dado.numero} salva e vinculada à ${code(dados.entregaId)}.`);
  fecharNF();
  irPara("notas");
}

/* =====================================================================
   MODAIS, FORMULÁRIOS E AVISOS
   ===================================================================== */
let focoAnterior = null;
function abrirModal(titulo, corpo, rodape, onReady) {
  focoAnterior = document.activeElement;
  $("#modalHost").innerHTML = `
    <div class="modal-back" id="mBack">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <div class="modal-head"><h2 id="mTitle">${titulo}</h2>
          <button class="icon-act" id="mClose" aria-label="Fechar">${ico("x", "ic-sm")}</button></div>
        <form id="mForm" novalidate>
          <div class="modal-body">${corpo}</div>
          <div class="modal-foot">${rodape}</div>
        </form>
      </div>
    </div>`;
  $("#mBack").addEventListener("pointerdown", e => { if (e.target.id === "mBack") fecharModal(); });
  $("#mClose").addEventListener("click", fecharModal);
  document.addEventListener("keydown", teclaModal);
  (onReady && onReady()) || ($("#modalHost input, #modalHost select, #modalHost .modal-foot button") || {}).focus?.();
}
function fecharModal() {
  $("#modalHost").innerHTML = "";
  document.removeEventListener("keydown", teclaModal);
  focoAnterior?.focus?.();
}
function teclaModal(e) {
  if (e.key === "Escape") return fecharModal();
  if (e.key === "Tab") {
    const f = $$("#modalHost button, #modalHost input, #modalHost select").filter(x => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
}
/* Mostra o erro devolvido pela API: no campo certo (validação) ou num aviso (regra de negócio).
   mapa liga o nome do campo na API ao id do campo no formulário. */
function mostrarErroApi(r, mapa) {
  if (r.campos) {
    let marcou = false;
    for (const [campoApi, msg] of Object.entries(r.campos)) {
      const id = mapa[campoApi];
      if (id && $("#" + id)?.closest(".field")?.querySelector(".err")) { erroCampo(id, msg); marcou = true; }
    }
    if (marcou) return focarErro();
  }
  toast(r.erro, true);
}
function focarErro() { $(".field.bad input, .field.bad select")?.focus(); }
function erroCampo(id, msg) {
  const box = $("#" + id).closest(".field"); box.classList.toggle("bad", !!msg);
  box.querySelector(".err").textContent = msg || "";
}
const campo = (id, label, attrs = "", hint = "") => `
  <div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id.slice(1).toLowerCase()}" ${attrs}>
  ${hint ? `<span class="hint">${hint}</span>` : ""}<span class="err" role="alert"></span></div>`;

function formCliente(id) {
  const c = id ? DB.acharCliente(id) : null;
  let ativo = c ? c.ativo : true;
  abrirModal(c ? "Editar cliente" : "Novo cliente",
    campo("fNome", "Nome", `value="${c ? esc(c.nome) : ""}" autocomplete="off" placeholder="Ex.: Maria Silva…"`) +
    campo("fIdade", "Idade", `type="number" inputmode="numeric" min="1" autocomplete="off" value="${c ? c.idade : ""}" placeholder="Ex.: 35…"`) +
    `<div class="field"><span class="sr" id="lblAtivo">Situação</span><label aria-hidden="true">Situação</label>
      <div class="toggle" role="group" aria-labelledby="lblAtivo">
        <button type="button" data-a="1" class="${ativo ? "on" : ""}" aria-pressed="${ativo}">Ativo</button>
        <button type="button" data-a="0" class="${!ativo ? "on" : ""}" aria-pressed="${!ativo}">Inativo</button>
      </div></div>`,
    `<button type="button" class="btn btn-ghost" id="mCancel">Cancelar</button><button type="submit" class="btn btn-primary">${c ? "Salvar alterações" : "Cadastrar cliente"}</button>`);
  $$(".toggle button").forEach(b => b.addEventListener("click", () => {
    ativo = b.dataset.a === "1";
    $$(".toggle button").forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); });
  }));
  $("#mCancel").addEventListener("click", fecharModal);
  $("#mForm").addEventListener("submit", async e => {
    e.preventDefault();
    const nome = $("#fNome").value.trim(), idade = Number($("#fIdade").value);
    erroCampo("fNome", nome ? "" : "Informe o nome.");
    erroCampo("fIdade", Number.isInteger(idade) && idade > 0 && idade <= 120 ? "" : "Informe uma idade entre 1 e 120.");
    if (!nome || !(Number.isInteger(idade) && idade > 0 && idade <= 120)) return focarErro();
    // PUT /clientes/{id} recebe o cliente completo; POST /clientes cria um novo
    const r = await ocupado(e.submitter, () => c ? DB.editarCliente(c.id, { nome, idade, ativo }) : DB.criarCliente({ nome, idade, ativo }));
    if (r.erro) return mostrarErroApi(r, { nome: "fNome", idade: "fIdade" });   // mantém o modal aberto para corrigir
    toast(c ? "Alterações salvas." : `${nome} cadastrado.`);
    fecharModal(); render();
  });
}

function formMotorista(id) {
  const m = id ? DB.acharMotorista(id) : null;
  abrirModal(m ? "Editar motorista" : "Novo motorista",
    campo("fNome", "Nome", `value="${m ? esc(m.nome) : ""}" autocomplete="off" placeholder="Ex.: João Souza…"`) +
    campo("fCnh", "CNH", `value="${m ? esc(m.cnh) : ""}" inputmode="numeric" maxlength="11" autocomplete="off" spellcheck="false" placeholder="Ex.: 12345678900…"`, "A CNH tem 11 dígitos.") +
    campo("fTel", "Telefone", `type="tel" autocomplete="off" value="${m ? esc(m.telefone) : ""}" placeholder="Ex.: (19) 99999-0000…"`),
    `<button type="button" class="btn btn-ghost" id="mCancel">Cancelar</button><button type="submit" class="btn btn-primary">${m ? "Salvar alterações" : "Cadastrar motorista"}</button>`);
  $("#mCancel").addEventListener("click", fecharModal);
  $("#mForm").addEventListener("submit", async e => {
    e.preventDefault();
    const nome = $("#fNome").value.trim(), cnh = $("#fCnh").value.replace(/\D/g, ""), telefone = $("#fTel").value.trim();
    erroCampo("fNome", nome ? "" : "Informe o nome.");
    erroCampo("fCnh", cnh.length === 11 ? "" : "A CNH precisa ter 11 dígitos. Digite só os números.");
    if (!nome || cnh.length !== 11) return focarErro();
    const r = await ocupado(e.submitter, () => m ? DB.editarMotorista(m.id, { nome, cnh, telefone }) : DB.criarMotorista({ nome, cnh, telefone }));
    if (r.erro) return mostrarErroApi(r, { nome: "fNome", cnh: "fCnh", telefone: "fTel" });
    toast(m ? "Alterações salvas." : `${nome} cadastrado.`);
    fecharModal(); render();
  });
}

function formEntrega() {
  const C = DB.listarClientes().filter(c => c.ativo);
  if (!C.length) return toast("Cadastre ou ative um cliente antes de criar uma entrega.", true);
  abrirModal("Nova entrega",
    `<div class="field"><label for="fCli">Cliente</label><select id="fCli">${C.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join("")}</select></div>` +
    campo("fEnd", "Endereço de entrega", `autocomplete="off" placeholder="Ex.: Rua das Flores, 123 - Centro, Limeira…"`) +
    `<span class="field"><span class="hint">A entrega começa como Pendente. O motorista é escolhido no despacho.</span></span>`,
    `<button type="button" class="btn btn-ghost" id="mCancel">Cancelar</button><button type="submit" class="btn btn-primary">Cadastrar entrega</button>`);
  $("#mCancel").addEventListener("click", fecharModal);
  $("#mForm").addEventListener("submit", async e => {
    e.preventDefault();
    const endereco = $("#fEnd").value.trim();
    erroCampo("fEnd", endereco ? "" : "Informe o endereço com rua, número e cidade.");
    if (!endereco) return focarErro();
    const r = await ocupado(e.submitter, () => DB.criarEntrega({ endereco, clienteId: Number($("#fCli").value) }));
    if (r.erro) return mostrarErroApi(r, { endereco: "fEnd" });
    const nova = r.dado;                              // a API devolve a entrega criada (201) com o Id
    toast(`${code(nova.id)} cadastrada.`); fecharModal();
    irPara("entregas", { fEnt: "todas", sel: nova.id });
  });
}

function abrirDespacho(id) {
  const M = DB.listarMotoristas(), e = DB.listarEntregas().find(x => x.id === id);
  if (!M.length) return toast("Cadastre um motorista antes de despachar.", true);
  abrirModal(`Despachar ${code(id)}`,
    `<div class="field"><span class="hint">${esc(e.endereco)}</span></div>
     <div class="field"><label for="fMot">Motorista</label><select id="fMot">${M.map(m => `<option value="${m.id}">${esc(m.nome)}</option>`).join("")}</select>
     <span class="hint">A entrega passa para Em trânsito com este motorista.</span></div>`,
    `<button type="button" class="btn btn-ghost" id="mCancel">Cancelar</button><button type="submit" class="btn btn-primary">${ico("send", "ic-sm")}Despachar</button>`);
  $("#mCancel").addEventListener("click", fecharModal);
  $("#mForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const mid = Number($("#fMot").value), nome = DB.acharMotorista(mid)?.nome;
    const r = await ocupado(ev.submitter, () => DB.atualizarStatusEntrega(id, "EmTransito", mid));
    if (r.erro) return toast(r.erro, true);
    toast(`${code(id)} despachada com ${nome}.`); fecharModal(); render();
  });
}

function confirmar(titulo, texto, rotulo, ok) {
  abrirModal(esc(titulo), `<p style="color:var(--fg-2)">${esc(texto)}</p>`,
    `<button type="button" class="btn btn-ghost" id="mCancel">Cancelar</button><button type="submit" class="btn btn-danger">${rotulo}</button>`,
    () => { $("#mCancel").focus(); return true; });
  $("#mCancel").addEventListener("click", fecharModal);
  $("#mForm").addEventListener("submit", e => { e.preventDefault(); fecharModal(); ok(); });
}

/* Trava o botão enquanto a API responde (evita clique duplo e cadastro repetido). */
async function ocupado(btn, fn) {
  if (btn) { btn.disabled = true; btn.setAttribute("aria-busy", "true"); }
  try { return await fn(); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.removeAttribute("aria-busy"); } }
}

function toast(msg, bad = false) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.innerHTML = ico(bad ? "alert" : "ccheck") + `<span>${esc(msg)}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 3000);
}

/* Cartão da sidebar: mostra se os dados vêm da API ou do modo demonstração. */
function pintarModo(modo) {
  const card = $("#modoCard"), api = modo === "api";
  card.classList.toggle("api", api);
  card.querySelector("b").textContent = api ? "Conectado à API" : "Modo demonstração";
  card.querySelector("span").textContent = api
    ? "Esta sessão é só sua: edite à vontade. Ao fechar a aba, tudo volta ao original."
    : "A API não respondeu. Dados de exemplo, só neste navegador.";
  card.querySelector("code").textContent = API_BASE.replace(/^https?:\/\//, "");
}

/* Restaurar: volta a sessão aos dados de exemplo (útil para quem está avaliando o sistema) */
$("#resetBtn").addEventListener("click", () => confirmar("Restaurar dados de exemplo?",
  "Tudo o que você cadastrou, despachou ou excluiu nesta sessão será desfeito.", "Restaurar", async () => {
    const r = await DB.reiniciar();
    if (r.erro) return toast(r.erro, true);
    S.sel = null; S.sheet = false; S.animou = false;
    toast("Dados de exemplo restaurados."); render();
  }));

/* Sem internet: avisa na hora e quando a conexão volta, recarrega os dados */
const avisoRede = document.createElement("div");
avisoRede.className = "sem-rede"; avisoRede.setAttribute("role", "status"); avisoRede.hidden = true;
avisoRede.innerHTML = ico("alert", "ic-sm") + "<span>Sem conexão com a internet. As alterações voltam a funcionar quando a conexão voltar.</span>";
document.body.appendChild(avisoRede);
window.addEventListener("offline", () => { avisoRede.hidden = false; });
window.addEventListener("online", async () => {
  avisoRede.hidden = true;
  if (DB.modo() === "api") { await DB.recarregar?.().catch(() => {}); render(); }
  toast("Conexão restabelecida.");
});

/* ---------- início ---------- */
(() => {
  const tema = pref.get("theme"); if (tema === "dark" || tema === "light") document.documentElement.dataset.theme = tema;
  if (pref.get("collapsed") === "1") setCollapsed(true);
  pintarBotaoTema();
  aplicarTrilho();
  const inicial = location.hash.slice(1);
  if (VIEWS[inicial]) S.view = inicial;
  // Carrega os dados (API ou demonstração) antes de desenhar a tela.
  DB.iniciar().then(modo => {
    pintarModo(modo);
    $("#content").removeAttribute("aria-busy");
    render();
  });
})();
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== S.view) irPara(v); });
</script>
